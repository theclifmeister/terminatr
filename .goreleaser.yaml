# Release builds (docs/OPERATIONS.md). Run through make, which builds the
# per-target libghostty-vt libraries and sets TM_GHOSTTY_REV/CPU:
#
#   make release-snapshot   archives in dist/, no tag, nothing uploaded
#   make release            what .github/workflows/release.yml runs on a tag
#
# tm needs cgo (libghostty-vt), so every target is cross-compiled with
# zig cc (scripts/release/cc.sh) against its own static libghostty-vt in
# .build/release/, except darwin, which Apple's clang and ld link (chained
# fixups, macOS 13.0). Linux binaries link glibc dynamically with a floor
# of 2.28; macOS binaries link only system libraries from the macOS SDK,
# so the whole release runs on a macOS host.
version: 2

project_name: tm

before:
  hooks:
    - go mod download
    # tm-relay-docker.tar.gz: deploy/relay's Docker files, pinned to this
    # release (an extra file below, so outside dist/, which isn't made yet).
    - '{{ .Env.TM_ROOT }}/scripts/release/relay-docker.sh {{ if .IsSnapshot }}v{{ .Version }}{{ else }}{{ .Tag }}{{ end }}'
    # terminatr-app.zip and .dmg: the Mac app, built, signed, notarised
    # and stapled (scripts/release/app.sh; unsigned without
    # TM_SIGN_IDENTITY), extra files below like the relay's. goreleaser
    # shows a before hook's output only when it fails.
    - '{{ .Env.TM_ROOT }}/scripts/release/app.sh {{ if .IsSnapshot }}v{{ .Version }}{{ else }}{{ .Tag }}{{ end }}'

builds:
  - id: tm
    main: ./cmd/tm
    binary: tm
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/theclifmeister/terminatr/internal/version.Version={{ if .IsSnapshot }}v{{ .Version }}{{ else }}{{ .Tag }}{{ end }}
      - -X github.com/theclifmeister/terminatr/internal/version.LibGhostty={{ .Env.TM_GHOSTTY_REV }}
      # Marks a binary built here, so `tm update` can tell it from a
      # source build (internal/update).
      - -X github.com/theclifmeister/terminatr/internal/version.Channel={{ if .IsSnapshot }}snapshot{{ else }}release{{ end }}
      # The signing team, which `tm update` requires of the next binary.
      - -X github.com/theclifmeister/terminatr/internal/version.TeamID={{ envOrDefault "TM_TEAM_ID" "" }}
    env:
      - CGO_ENABLED=1
      - CC={{ .Env.TM_ROOT }}/scripts/release/cc.sh
    # Signs and notarises the darwin binaries before they are archived
    # (scripts/release/sign.sh); without TM_SIGN_IDENTITY it only says so.
    hooks:
      post:
        - cmd: '{{ .Env.TM_ROOT }}/scripts/release/sign.sh "{{ .Path }}" {{ .Os }}'
          output: true
    overrides:
      - goos: darwin
        goarch: arm64
        env:
          - TM_ZIG_TARGET=aarch64-macos
          - PKG_CONFIG_PATH={{ .Env.TM_ROOT }}/.build/release/ghostty-{{ .Env.TM_GHOSTTY_REV }}-{{ .Env.TM_GHOSTTY_CPU }}-aarch64-macos/share/pkgconfig
          # Names the library build in Go's cache key (see the Makefile).
          - CGO_CFLAGS=-O2 -g -DTM_LIBGHOSTTY={{ .Env.TM_ROOT }}/.build/release/ghostty-{{ .Env.TM_GHOSTTY_REV }}-{{ .Env.TM_GHOSTTY_CPU }}-aarch64-macos
      - goos: darwin
        goarch: amd64
        env:
          - TM_ZIG_TARGET=x86_64-macos
          - PKG_CONFIG_PATH={{ .Env.TM_ROOT }}/.build/release/ghostty-{{ .Env.TM_GHOSTTY_REV }}-{{ .Env.TM_GHOSTTY_CPU }}-x86_64-macos/share/pkgconfig
          - CGO_CFLAGS=-O2 -g -DTM_LIBGHOSTTY={{ .Env.TM_ROOT }}/.build/release/ghostty-{{ .Env.TM_GHOSTTY_REV }}-{{ .Env.TM_GHOSTTY_CPU }}-x86_64-macos
      - goos: linux
        goarch: arm64
        env:
          - TM_ZIG_TARGET=aarch64-linux-gnu.2.28
          - PKG_CONFIG_PATH={{ .Env.TM_ROOT }}/.build/release/ghostty-{{ .Env.TM_GHOSTTY_REV }}-{{ .Env.TM_GHOSTTY_CPU }}-aarch64-linux-gnu.2.28/share/pkgconfig
          - CGO_CFLAGS=-O2 -g -DTM_LIBGHOSTTY={{ .Env.TM_ROOT }}/.build/release/ghostty-{{ .Env.TM_GHOSTTY_REV }}-{{ .Env.TM_GHOSTTY_CPU }}-aarch64-linux-gnu.2.28
      - goos: linux
        goarch: amd64
        env:
          - TM_ZIG_TARGET=x86_64-linux-gnu.2.28
          - PKG_CONFIG_PATH={{ .Env.TM_ROOT }}/.build/release/ghostty-{{ .Env.TM_GHOSTTY_REV }}-{{ .Env.TM_GHOSTTY_CPU }}-x86_64-linux-gnu.2.28/share/pkgconfig
          - CGO_CFLAGS=-O2 -g -DTM_LIBGHOSTTY={{ .Env.TM_ROOT }}/.build/release/ghostty-{{ .Env.TM_GHOSTTY_REV }}-{{ .Env.TM_GHOSTTY_CPU }}-x86_64-linux-gnu.2.28

  - id: tm-windows
    main: ./cmd/tm
    binary: tm
    goos: [windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/theclifmeister/terminatr/internal/version.Version={{ if .IsSnapshot }}v{{ .Version }}{{ else }}{{ .Tag }}{{ end }}
      - -X github.com/theclifmeister/terminatr/internal/version.LibGhostty={{ .Env.TM_GHOSTTY_REV }}
      # Marks a binary built here, so `tm update` can tell it from a
      # source build (internal/update).
      - -X github.com/theclifmeister/terminatr/internal/version.Channel={{ if .IsSnapshot }}snapshot{{ else }}release{{ end }}
      # The signing team, which `tm update` requires of the next binary.
      - -X github.com/theclifmeister/terminatr/internal/version.TeamID={{ envOrDefault "TM_TEAM_ID" "" }}
    env:
      - CGO_ENABLED=1
      - CC={{ .Env.TM_ROOT }}/scripts/release/cc.sh
    overrides:
      - goos: windows
        goarch: arm64
        env:
          - TM_ZIG_TARGET=aarch64-windows-gnu
          - PKG_CONFIG_PATH={{ .Env.TM_ROOT }}/.build/release/ghostty-{{ .Env.TM_GHOSTTY_REV }}-{{ .Env.TM_GHOSTTY_CPU }}-aarch64-windows-gnu/share/pkgconfig
          - CGO_CFLAGS=-O2 -g -DTM_LIBGHOSTTY={{ .Env.TM_ROOT }}/.build/release/ghostty-{{ .Env.TM_GHOSTTY_REV }}-{{ .Env.TM_GHOSTTY_CPU }}-aarch64-windows-gnu
      - goos: windows
        goarch: amd64
        env:
          - TM_ZIG_TARGET=x86_64-windows-gnu
          - PKG_CONFIG_PATH={{ .Env.TM_ROOT }}/.build/release/ghostty-{{ .Env.TM_GHOSTTY_REV }}-{{ .Env.TM_GHOSTTY_CPU }}-x86_64-windows-gnu/share/pkgconfig
          - CGO_CFLAGS=-O2 -g -DTM_LIBGHOSTTY={{ .Env.TM_ROOT }}/.build/release/ghostty-{{ .Env.TM_GHOSTTY_REV }}-{{ .Env.TM_GHOSTTY_CPU }}-x86_64-windows-gnu

# The darwin binaries are signed with a Developer ID (hardened runtime)
# and notarised by the build hook above when the release workflow
# provides the credentials (TM_SIGN_IDENTITY, TM_NOTARY_*). Snapshots are
# left as Apple's ld made them: arm64 ad-hoc signed, amd64 unsigned.

archives:
  - id: tm
    ids: [tm]
    formats: [tar.gz]
    # No version in the name, so releases/latest/download/tm_<os>_<arch>.tar.gz
    # is a stable install URL (README.md).
    name_template: "tm_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - docs/OPERATIONS.md

  # Windows: a zip with Microsoft's ConPTY next to tm.exe
  # (scripts/release/conpty.sh stages it).
  - id: tm-windows
    ids: [tm-windows]
    formats: [zip]
    name_template: "tm_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - docs/OPERATIONS.md
      - src: '{{ .Env.TM_ROOT }}/.build/release/conpty/{{ .Arch }}/*'
        dst: .
        strip_parent: true

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: ./.build/release/tm-relay-docker.tar.gz
    - glob: ./.build/release/app/terminatr-app.zip
    - glob: ./.build/release/app/terminatr-app.dmg

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

# The notes are release-please's CHANGELOG.md entry, already in the draft
# release it created (release-please-config.json); goreleaser writes none.
changelog:
  disable: true

release:
  github:
    owner: theclifmeister
    name: terminatr
  # A draft; the release workflow publishes it once the uploaded archives
  # pass scripts/release/check.sh --signed, then bumps Formula/terminatr.rb.
  # The archives go into release-please's draft of the same name (the tag,
  # v0.29.0), keeping its notes; for a tag pushed by hand there is none, and
  # goreleaser creates the draft, without notes.
  draft: true
  use_existing_draft: true
  name_template: "{{ .Tag }}"
  mode: keep-existing
  prerelease: auto
  # The installers, at releases/latest/download/install.ps1 (Windows) and
  # install.sh (Linux, macOS), and the relay's Docker files at
  # releases/latest/download/tm-relay-docker.tar.gz (docs/OPERATIONS.md,
  # Running a relay), and the Mac app at
  # releases/latest/download/terminatr-app.{zip,dmg} (docs/OPERATIONS.md,
  # The Mac app).
  extra_files:
    - glob: ./scripts/install.ps1
    - glob: ./scripts/install.sh
    - glob: ./.build/release/tm-relay-docker.tar.gz
    - glob: ./.build/release/app/terminatr-app.zip
    - glob: ./.build/release/app/terminatr-app.dmg
