<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Bloom's mesh (light; Theme.bloom, Backdrop.swift): coral, violet, lime and lagoon from the corners, bubblegum at the centre, over the base. -->
  <defs>
    <radialGradient id="coral" cx="100" cy="100" r="560" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff6b4a"/><stop offset="1" stop-color="#ff6b4a" stop-opacity="0"/></radialGradient>
    <radialGradient id="violet" cx="924" cy="100" r="560" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7b5cff"/><stop offset="1" stop-color="#7b5cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="lime" cx="100" cy="924" r="560" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#c6f432"/><stop offset="1" stop-color="#c6f432" stop-opacity="0"/></radialGradient>
    <radialGradient id="lagoon" cx="924" cy="924" r="560" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#29d3c3"/><stop offset="1" stop-color="#29d3c3" stop-opacity="0"/></radialGradient>
    <radialGradient id="bubblegum" cx="560" cy="470" r="380" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff5fb7"/><stop offset="1" stop-color="#ff5fb7" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="#f3d7ff"/>
  <rect width="1024" height="1024" fill="url(#coral)"/>
  <rect width="1024" height="1024" fill="url(#violet)"/>
  <rect width="1024" height="1024" fill="url(#lime)"/>
  <rect width="1024" height="1024" fill="url(#lagoon)"/>
  <rect width="1024" height="1024" fill="url(#bubblegum)"/>
</svg>
