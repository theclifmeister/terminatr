name: ci

# Lean by design (GitHub bills every job, rounded up to the minute):
#   pull request  one Linux job (`test`: gofmt, build, vet, cross-vet, unit
#                 tests, selftest, e2e smoke), plus mod-types / obsidian / release-snapshot when their
#                 files change, and macos-app when the Mac app or the app API changes. No -race. Docs-only and site-only changes
#                 skip it.
#   push to main  the same Linux job with unit tests under -race (the e2e
#                 smoke stays race-free), and macOS (`macos`: build, unit
#                 tests, e2e smoke). Release tags wait for this. macos-app
#                 runs only when the pushed commit changes its files.
# Slow checks (fuzzing, the full e2e suite, race-built smoke) run weekly:
# weekly.yml.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request supersedes the run in flight; main keeps
# running every commit, so each one has a result. GitHub keeps only one
# pending run per group, so main's group includes the sha: a newer pending
# run would otherwise cancel an older pending one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Without -race on pull requests: a race-built tm starts slowly and every
  # agent hook starts one, and unsharded on main it hit the go test timeout.
  # Main runs only the unit tests with -race (make test-race); the
  # race-built smoke set runs weekly (weekly.yml).
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup

      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - name: build
        run: make build

      - name: vet (go vet, staticcheck)
        run: make vet

      # GOOS=windows, darwin and freebsd without cgo: seconds, no runner.
      - name: cross-vet (windows, darwin, freebsd)
        run: make vet-cross

      - name: test
        run: make ${{ github.event_name == 'push' && 'test-race' || 'test' }}

      - name: selftest
        run: ./bin/tm selftest

      # For TestSmokeCodexSandbox: the thread sandbox under Linux's
      # bubblewrap (T189). `codex sandbox` needs no login. Ubuntu 24.04
      # lets no unprivileged process map a user namespace, which bwrap
      # needs ("bwrap: setting up uid map: Permission denied").
      - name: codex
        run: |
          npm install -g @openai/codex@0.160.0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Internal/e2e TestSmoke*.
      - name: e2e smoke
        run: make e2e-smoke
        env:
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e-artifacts
          E2E_CODEX_SANDBOX: "1"

      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-artifacts-linux
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore

  # macOS, on main only: it gates release tags (the release is built on
  # macOS) but a pull request never waits for it. No -race: Linux covers it.
  macos:
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup

      - name: build
        run: make build

      - name: test
        run: make test

      - name: e2e smoke
        run: make e2e-smoke
        env:
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e-artifacts

      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-artifacts-macos
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore

  # What this event needs. Each job is skipped otherwise; a job skipped by
  # its `if` counts as passed for required checks, unlike a workflow left
  # out by a paths filter, which would leave them pending.
  #   code     build and test: every push to main, and pull requests that
  #            change anything but docs/, site/ (the website) and the root *.md
  #            (not the embedded rules and templates: scripts/ci-code-files.sh)
  #   release  the release snapshot: pull requests that touch the release
  #            build. Not main: a release tag runs it (release.yml).
  #   modapi   the user mods' types check: every push, and pull requests
  #            that touch the mod API, its scaffolds or this file.
  #   obsidian the Obsidian plugin's check: every push, and pull requests
  #            that touch obsidian/ or this file.
  #   app      the Mac app's build: pushes and pull requests that touch
  #            macos/, the app API (internal/appapi) or this file. macOS
  #            minutes are metered, so a push to main runs it only for
  #            such a commit too (main gets squash merges: one commit).
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.code.outputs.code }}
      release: ${{ steps.release.outputs.release }}
      modapi: ${{ steps.modapi.outputs.modapi }}
      obsidian: ${{ steps.obsidian.outputs.obsidian }}
      app: ${{ steps.app.outputs.app }}
    steps:
      # A pull request checks out its merge commit, whose first parent is
      # the base; a push to main its commit: depth 2 is enough to diff
      # either with its parent.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Code changes (not only docs)
        id: code
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hits=$(git diff --name-only HEAD^1 HEAD | scripts/ci-code-files.sh)
          echo "non-docs: ${hits:-none}"
          echo "code=$([ -n "$hits" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Release-related files
        id: release
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only HEAD^1 HEAD)
          printf '%s\n' "$files"
          hits=$(printf '%s\n' "$files" | grep -E '^(\.goreleaser\.yaml|Makefile|go\.(mod|sum)|scripts/release/|deploy/relay/|Formula/|Casks/|macos/(Makefile|Info\.plist)$|\.github/workflows/(ci|release)\.yml|\.github/actions/|internal/(emu|version)/|cmd/tm/main\.go)' || true)
          echo "release-related: ${hits:-none}"
          echo "release=$([ -n "$hits" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Mod API files
        id: modapi
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "modapi=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hits=$(git diff --name-only HEAD^1 HEAD | grep -E '^(internal/modapi/|internal/moddev/|examples/mods/|\.github/workflows/ci\.yml$)' || true)
          echo "modapi-related: ${hits:-none}"
          echo "modapi=$([ -n "$hits" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Obsidian plugin files
        id: obsidian
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "obsidian=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hits=$(git diff --name-only HEAD^1 HEAD | grep -E '^(obsidian/|\.github/workflows/ci\.yml$)' || true)
          echo "obsidian-related: ${hits:-none}"
          echo "obsidian=$([ -n "$hits" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Mac app files
        id: app
        run: |
          hits=$(git diff --name-only HEAD^1 HEAD | grep -E '^(macos/|internal/appapi/|\.github/workflows/ci\.yml$)' || true)
          echo "app-related: ${hits:-none}"
          echo "app=$([ -n "$hits" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # The user mods' types (docs/SPEC.md §5.3, Mod dev tools): tsc --strict
  # on tm mod new's code scaffolds, internal/modapi/testdata's examples
  # and examples/mods against the generated tm.d.ts. Needs Go and a pinned
  # TypeScript, not libghostty.
  mod-types:
    needs: changes
    if: needs.changes.outputs.modapi == 'true'
    runs-on: ubuntu-latest
    env:
      TYPESCRIPT_VERSION: 5.9.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Install TypeScript
        run: |
          npm install -g "typescript@${TYPESCRIPT_VERSION}"
          tsc --version

      - name: tsc --strict
        run: go test -count=1 -run '^TestTypesCompileStrict$' -v ./internal/moddev
        env:
          TERMINATR_TSC_CHECK: "1"

  # terminatr's Obsidian plugin (docs/SPEC.md §5.1, Vault): tsc --strict
  # on obsidian/src against the pinned Obsidian API types, its node tests,
  # and tm's own bundle of it (go test ./obsidian), which tm vault init
  # --plugin installs. Needs Go and node, not libghostty.
  obsidian:
    needs: changes
    if: needs.changes.outputs.obsidian == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: obsidian
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: tsc --strict
        run: npm run check

      - name: node tests
        run: npm test

      - name: tm's bundle
        run: go test -count=1 -v .
        env:
          CGO_ENABLED: "0"

  # The Mac app (macos/, docs/SPEC.md §3.8): its Codable types against
  # the app API's schema (generated by internal/appapi), then swift
  # build, swift test and the .app bundle, unsigned (signing comes with
  # the release job). Needs Go without cgo, and Xcode, not libghostty.
  macos-app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: AppAPI.swift is the schema's
        run: go test -count=1 -run '^TestSwiftCurrent$' ./internal/appapi
        env:
          CGO_ENABLED: "0"

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # SwiftTerm (the terminal tab) compiles a Metal shader; Xcode 26+
      # ships the Metal toolchain as a separate component.
      - name: Metal toolchain
        run: |
          xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
          xcrun metal --version

      - name: swift test
        run: make -C macos test

      # Universal, as the release builds it (scripts/release/app.sh): one
      # build per architecture, joined by lipo (macos/Makefile).
      - name: Terminatr.app
        run: make -C macos app ARCHS="arm64 x86_64"

  # The release build (.goreleaser.yaml) as a snapshot: every target
  # cross-compiled with zig cc and archived, and the Mac app unsigned
  # (scripts/release/app.sh), nothing tagged or uploaded. macOS, like the
  # release itself: darwin targets need the macOS SDK, the app Xcode.
  release-snapshot:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/release-setup

      - name: goreleaser check
        run: goreleaser check

      - name: release snapshot
        run: make release-snapshot

      - name: Check the archives
        run: scripts/release/check.sh dist

      # The formula and the Mac app's cask the release job will write for
      # these archives, through Homebrew's own style check.
      - name: Formula and cask
        run: |
          # In a Formula/ or Casks/ directory, or brew style checks it as plain Ruby.
          mkdir -p "$RUNNER_TEMP/Formula" "$RUNNER_TEMP/Casks"
          scripts/release/formula.sh 0.0.0 dist/checksums.txt > "$RUNNER_TEMP/Formula/terminatr.rb"
          scripts/release/cask.sh 0.0.0 dist/checksums.txt > "$RUNNER_TEMP/Casks/terminatr-app.rb"
          # One at a time: together they define the class twice.
          brew style "$RUNNER_TEMP/Formula/terminatr.rb"
          brew style Formula/terminatr.rb
          brew style "$RUNNER_TEMP/Casks/terminatr-app.rb"
          # The release job adds the cask with the first release that has the app.
          if [ -f Casks/terminatr-app.rb ]; then brew style Casks/terminatr-app.rb; fi

      - name: Upload archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
            dist/checksums.txt
          retention-days: 7
