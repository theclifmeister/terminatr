name: release

# Releases a version tag (git tag v0.1.0 && git push origin v0.1.0):
#
#   1. import the Developer ID certificate into a temporary keychain
#   2. check a snapshot of the commit (nothing signed or uploaded)
#   3. goreleaser builds every target, signs and notarises the darwin
#      binaries (scripts/release/sign.sh) and uploads the archives and
#      checksums.txt to a draft release
#   4. the uploaded archives are checked again, signatures included, and
#      only then is the release published
#   5. Formula/terminatr.rb is bumped in a pull request that merges itself
#   6. the relay image (deploy/relay/Dockerfile, from the published linux
#      binaries) goes to ghcr.io/theclifmeister/tm-relay, on a Linux runner
#
# The build runs on one macOS runner: tm needs cgo, the Linux targets are
# cross-compiled with zig cc, and the darwin targets are linked by Apple's
# clang and ld from the macOS SDK. The image needs Docker, which macOS
# runners lack, so it has its own job once the release is published.
# The secrets are listed in docs/OPERATIONS.md (Releasing).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # The formula bump opens and merges its own pull request.
  pull-requests: write

jobs:
  release:
    runs-on: macos-latest
    # The Apple secrets belong in this environment, restricted to v* tags
    # (docs/OPERATIONS.md, Releasing): no other workflow, and no pull
    # request, can read them. Repository secrets of the same names work
    # too, but are readable by any workflow on a branch of this repository.
    environment: release
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the formula bump pushes a branch, which git refuses
          # from a shallow clone.
          fetch-depth: 0

      - name: Derive version
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          # goreleaser marks v1.2.3-rc1 and the like as prereleases (prerelease:
          # auto); Homebrew's livecheck skips them, so the formula does too.
          case "$GITHUB_REF_NAME" in
          *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
          *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # The release notes are written by hand, one file per tag; fail now,
      # not after the build, when this tag has none (docs/OPERATIONS.md, Releasing).
      - name: Release notes
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -s "$notes" ]; then
            echo "::error::$notes is missing or empty: write the release notes for $GITHUB_REF_NAME there, commit it, and tag that commit (docs/OPERATIONS.md, Releasing)"
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Pins
        id: pins
        run: |
          echo "zig=$(grep -E '^ZIG_(VERSION|SHA256_)' Makefile | git hash-object --stdin)" >> "$GITHUB_OUTPUT"
          echo "ghostty=$({ grep -E '^(GHOSTTY_(REV|REPO|CPU)|ZIG_VERSION) ' Makefile; echo "$GITHUB_WORKSPACE"; } | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

      - name: Cache Zig
        uses: actions/cache@v6
        with:
          path: .build/zig-*
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.zig }}

      # Shared with ci.yml's release-snapshot job.
      - name: Cache release libghostty-vt
        uses: actions/cache@v6
        with:
          path: |
            .build/release/ghostty-*
            !.build/release/ghostty-src
          key: ghostty-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.ghostty }}-${{ hashFiles('scripts/release/targets.sh') }}

      - name: pkg-config
        run: command -v pkg-config || brew install pkgconf

      - uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true
          version: "~> v2"

      # The same Developer ID as toe. The identity is found in the imported
      # certificate rather than spelled out, and must belong to APPLE_TEAM_ID.
      - name: Import signing certificate
        id: cert
        env:
          CERT_P12_BASE64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for v in CERT_P12_BASE64 CERT_PASSWORD KEYCHAIN_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || { echo "the $v secret is missing (docs/OPERATIONS.md, Releasing)" >&2; exit 1; }
          done
          keychain="$RUNNER_TEMP/tm-signing.keychain-db"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/tm-release.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$RUNNER_TEMP/tm-release.p12" -k "$keychain" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          # Without this codesign blocks on a GUI keychain prompt and the job hangs.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/tm-release.p12"

          # find-identity exits 0 even when it finds nothing. A leaf whose
          # intermediate is missing from the .p12 is not listed as valid.
          security find-identity -v -p codesigning "$keychain"
          # Sign by SHA-1, not by name: codesign refuses a name that two
          # certificates share ("ambiguous"), as after a renewal.
          identity=$(security find-identity -v -p codesigning "$keychain" |
            grep "\"Developer ID Application: .* ($APPLE_TEAM_ID)\"" | awk '{print $2}' | head -1)
          if [ -z "$identity" ]; then
            echo "no valid Developer ID Application identity for team $APPLE_TEAM_ID — does" >&2
            echo "SIGNING_CERT_P12_BASE64 include the Developer ID Certification Authority intermediate?" >&2
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      # Check a snapshot of the same commit before anything is uploaded
      # (open-source goreleaser can't publish a dist/ built earlier). The
      # snapshot is not signed; the release below rebuilds dist/ from the
      # same libraries and Go cache.
      - name: Check the archives
        run: |
          make release-snapshot
          scripts/release/check.sh dist

      - name: Release (draft)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TM_SIGN_IDENTITY: ${{ steps.cert.outputs.identity }}
          TM_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          TM_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          TM_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          for v in NOTARY_KEY_P8_BASE64 TM_NOTARY_KEY_ID TM_NOTARY_ISSUER; do
            [ -n "${!v}" ] || { echo "a notary secret is missing ($v; docs/OPERATIONS.md, Releasing)" >&2; exit 1; }
          done
          export TM_NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          trap 'rm -f "$TM_NOTARY_KEY"' EXIT
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$TM_NOTARY_KEY"
          make release RELEASE_NOTES="docs/releases/${GITHUB_REF_NAME}.md"

      # What was uploaded is what dist/ holds: checksums, contents, and now
      # the Developer ID signature, hardened runtime and notarisation.
      - name: Check the signed archives
        run: scripts/release/check.sh --signed dist

      # goreleaser must have put the hand-written notes in the draft's body
      # (it once did not: v0.28.0 went out empty). Compare, and fail rather
      # than publish a release whose body differs from docs/releases/<tag>.md.
      - name: Check the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          want=$(cat "docs/releases/${GITHUB_REF_NAME}.md")
          got=$(gh release view "$GITHUB_REF_NAME" --json body -q .body | tr -d '\r')
          if [ "$got" != "$want" ]; then
            echo "::error::the draft release body for $GITHUB_REF_NAME differs from docs/releases/${GITHUB_REF_NAME}.md; not publishing"
            printf 'body:\n%s\n' "$got" >&2
            exit 1
          fi

      - name: Publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --draft=false
          echo "published=true" >> "$GITHUB_OUTPUT"

      # Same as toe's cask bump: open a pull request with the new formula and
      # merge it, so the release stays one step. Both values come from the
      # release built above. [skip ci] because the PR merges within seconds
      # and the branch is deleted under any run it would start; --subject on
      # the merge keeps the marker out of main.
      - name: Bump formula
        if: steps.version.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin main
          branch="formula-$VERSION"
          git checkout -B "$branch" origin/main
          scripts/release/formula.sh "$VERSION" dist/checksums.txt > Formula/terminatr.rb
          if git diff --quiet Formula/terminatr.rb; then
            echo "formula already at $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bump terminatr formula to $VERSION [skip ci]" Formula/terminatr.rb
          # The branch is named per version and owned by this job: anything
          # already there is debris from a failed run of this release.
          git push --force origin "$branch"

          # gh pr create fails if a PR for the branch exists, and GitHub has
          # bad seconds: check, then create, five times.
          opened=
          for attempt in 1 2 3 4 5; do
            if [ -n "$(gh pr list --head "$branch" --state open --json number -q '.[0].number')" ]; then
              opened=1
              break
            fi
            if gh pr create --base main --head "$branch" \
              --title "Bump terminatr formula to $VERSION" \
              --body "Generated by the release job for v$VERSION from its checksums.txt."; then
              opened=1
              break
            fi
            echo "create attempt $attempt failed, retrying in 10s"
            sleep 10
          done
          if [ -z "$opened" ] && [ -z "$(gh pr list --head "$branch" --state open --json number -q '.[0].number')" ]; then
            echo "could not open the formula PR for $VERSION — the release is published and" >&2
            echo "$branch is pushed, so open the pull request by hand." >&2
            exit 1
          fi

          git checkout --detach
          # Mergeability is computed asynchronously: retry. The ruleset on
          # main must let this PR merge without checks (as toe's does): its
          # [skip ci] commit starts no CI run.
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$branch" --squash --subject "Bump terminatr formula to $VERSION"; then
              git push origin --delete "$branch" || true
              exit 0
            fi
            echo "merge attempt $attempt failed, retrying in 10s"
            sleep 10
          done
          # A ruleset that requires checks or a review refuses the merge:
          # queue it with auto-merge (if the repository allows it) and say so.
          if gh pr merge "$branch" --auto --squash --subject "Bump terminatr formula to $VERSION"; then
            echo "::warning::the formula PR for $VERSION waits for the rules on main (auto-merge is on); see docs/OPERATIONS.md, Releasing"
            exit 0
          fi
          echo "could not merge the formula bump for $VERSION — the release is published, but" >&2
          echo "Formula/terminatr.rb on main still names the previous version. Merge the PR by hand." >&2
          exit 1

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/tm-signing.keychain-db" || true

  # The relay image, for amd64 and arm64, built by deploy/relay/Dockerfile
  # from this release's published linux archives, checked against its
  # checksums.txt, as `docker build` anywhere does: the image holds exactly
  # the released binary. Tagged with the version and, unless a prerelease,
  # latest. It runs once the release is published, even if the formula
  # bump after that failed. A failure here leaves the release published;
  # rerun this job.
  image:
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Tags
        id: tags
        env:
          PRERELEASE: ${{ needs.release.outputs.prerelease }}
        run: |
          image=ghcr.io/theclifmeister/tm-relay
          tags="$image:$GITHUB_REF_NAME"
          if [ "$PRERELEASE" = false ]; then
            tags="$tags,$image:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      # arm64's build stage runs the binary (tm version) under emulation.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: deploy/relay
          platforms: linux/amd64,linux/arm64
          build-args: TM_VERSION=${{ github.ref_name }}
          tags: ${{ steps.tags.outputs.tags }}
          push: true
