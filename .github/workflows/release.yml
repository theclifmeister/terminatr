name: release

# Releases a version tag. release-please.yml pushes the tag, as the release
# GitHub App, when its release pull request is merged, and the push starts
# this; a tag pushed by hand (git tag v0.1.0 && git push origin v0.1.0)
# starts it too. Either way github.ref is the tag:
#
#   1. import the Developer ID certificate into a temporary keychain
#   2. check a snapshot of the commit (nothing signed or uploaded)
#   3. goreleaser builds every target, signs and notarises the darwin
#      binaries (scripts/release/sign.sh), builds, signs, notarises and
#      staples the Mac app with the same identity (scripts/release/app.sh:
#      terminatr-app.zip and .dmg) and uploads the archives and
#      checksums.txt to the draft release: release-please's, with its
#      CHANGELOG.md notes, or for a hand-made tag a new one without notes
#   4. the uploaded archives are checked again, signatures included, and
#      only then is the release published
#   5. Formula/terminatr.rb and Casks/terminatr-app.rb (the Mac app) are
#      bumped in a pull request that merges itself, opened as the release
#      App so that ci.yml runs on it
#   6. the relay image (deploy/relay/Dockerfile, from the published linux
#      binaries) goes to ghcr.io/theclifmeister/tm-relay, on a Linux runner
#   7. the iPhone app is archived, signed and uploaded to TestFlight
#      (scripts/release/ios.sh), on its own macOS runner, once the
#      release is published; skipped while its secrets aren't set
#      (ios/README.md, TestFlight)
#
# The build runs on one macOS runner: tm needs cgo, the Linux targets are
# cross-compiled with zig cc, the darwin targets are linked by Apple's
# clang and ld from the macOS SDK, and the Mac app needs Xcode. The image needs Docker, which macOS
# runners lack, so it has its own job once the release is published.
# The secrets are listed in docs/OPERATIONS.md (Releasing).

on:
  push:
    tags: ["v*"]
  # To rerun a release by hand: only on a v* tag (Use workflow from → Tags),
  # as the release job's if: says.
  workflow_dispatch:

permissions:
  # The draft release's uploads, publishing it, and the formula branch.
  # The formula pull request goes through the release App's token.
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    # The Apple secrets belong in this environment, restricted to v* tags
    # (docs/OPERATIONS.md, Releasing): no other workflow, and no pull
    # request, can read them. Repository secrets of the same names work
    # too, but are readable by any workflow on a branch of this repository.
    environment: release
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      published: ${{ steps.publish.outputs.published }}
      testflight: ${{ steps.testflight.outputs.testflight }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the formula bump pushes a branch, which git refuses
          # from a shallow clone.
          fetch-depth: 0

      - name: Derive version
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          # goreleaser marks v1.2.3-rc1 and the like as prereleases (prerelease:
          # auto); Homebrew's livecheck skips them, so the formula does too.
          case "$GITHUB_REF_NAME" in
          *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
          *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: ./.github/actions/release-setup

      # Whether the testflight job runs: only once any of its secrets is
      # set (a job's if: can't read secrets). Only their presence is
      # looked at. Some but not all set runs it too, and it fails naming
      # the missing ones.
      - name: TestFlight secrets
        id: testflight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD IOS_PROFILE_BASE64; do
            if [ -n "${!v}" ]; then
              echo "testflight=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::notice::no TestFlight secrets: the iPhone app is not uploaded (ios/README.md, TestFlight)"
          echo "testflight=false" >> "$GITHUB_OUTPUT"

      # The same Developer ID as toe. The identity is found in the imported
      # certificate rather than spelled out, and must belong to APPLE_TEAM_ID.
      - name: Import signing certificate
        id: cert
        env:
          CERT_P12_BASE64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for v in CERT_P12_BASE64 CERT_PASSWORD KEYCHAIN_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || { echo "the $v secret is missing (docs/OPERATIONS.md, Releasing)" >&2; exit 1; }
          done
          keychain="$RUNNER_TEMP/tm-signing.keychain-db"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/tm-release.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$RUNNER_TEMP/tm-release.p12" -k "$keychain" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          # Without this codesign blocks on a GUI keychain prompt and the job hangs.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/tm-release.p12"

          # find-identity exits 0 even when it finds nothing. A leaf whose
          # intermediate is missing from the .p12 is not listed as valid.
          security find-identity -v -p codesigning "$keychain"
          # Sign by SHA-1, not by name: codesign refuses a name that two
          # certificates share ("ambiguous"), as after a renewal.
          identity=$(security find-identity -v -p codesigning "$keychain" |
            grep "\"Developer ID Application: .* ($APPLE_TEAM_ID)\"" | awk '{print $2}' | head -1)
          if [ -z "$identity" ]; then
            echo "no valid Developer ID Application identity for team $APPLE_TEAM_ID — does" >&2
            echo "SIGNING_CERT_P12_BASE64 include the Developer ID Certification Authority intermediate?" >&2
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      # Check a snapshot of the same commit before anything is uploaded
      # (open-source goreleaser can't publish a dist/ built earlier). The
      # snapshot is not signed; the release below rebuilds dist/ from the
      # same libraries and Go cache.
      - name: Check the archives
        run: |
          make release-snapshot
          scripts/release/check.sh dist

      - name: Release (draft)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TM_SIGN_IDENTITY: ${{ steps.cert.outputs.identity }}
          TM_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          TM_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          TM_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          for v in NOTARY_KEY_P8_BASE64 TM_NOTARY_KEY_ID TM_NOTARY_ISSUER; do
            [ -n "${!v}" ] || { echo "a notary secret is missing ($v; docs/OPERATIONS.md, Releasing)" >&2; exit 1; }
          done
          export TM_NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          trap 'rm -f "$TM_NOTARY_KEY"' EXIT
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$TM_NOTARY_KEY"
          make release

      # What was uploaded is what dist/ holds: checksums, contents, and now
      # the Developer ID signature, hardened runtime and notarisation.
      - name: Check the signed archives
        run: scripts/release/check.sh --signed dist

      - name: Publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --draft=false
          echo "published=true" >> "$GITHUB_OUTPUT"

      # Made here, not at the start: an installation token lasts an hour,
      # and signing and notarising can take most of that.
      - id: app
        if: steps.version.outputs.prerelease == 'false'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}

      # Same as toe's cask bump: open a pull request with the new formula and
      # the Mac app's cask (scripts/release/cask.sh) and merge it, so the
      # release stays one step. Their versions and checksums come from the
      # release built above. The pull request is opened and merged as the
      # release App, not with GITHUB_TOKEN, so ci.yml runs on it (and on the
      # merge commit on main), and a rule on main that requires checks waits
      # for them (auto-merge) instead of refusing the merge. chore: keeps it
      # out of the next release's notes (release-please-config.json).
      - name: Bump formula and cask
        if: steps.version.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin main
          branch="formula-$VERSION"
          git checkout -B "$branch" origin/main
          scripts/release/formula.sh "$VERSION" dist/checksums.txt > Formula/terminatr.rb
          mkdir -p Casks
          scripts/release/cask.sh "$VERSION" dist/checksums.txt > Casks/terminatr-app.rb
          # The first release with the app adds the cask: staged, it counts.
          git add Formula/terminatr.rb Casks/terminatr-app.rb
          if git diff --cached --quiet; then
            echo "formula and cask already at $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: bump terminatr formula and cask to $VERSION"
          # The branch is named per version and owned by this job: anything
          # already there is debris from a failed run of this release.
          git push --force origin "$branch"

          # gh pr create fails if a PR for the branch exists, and GitHub has
          # bad seconds: check, then create, five times.
          opened=
          for attempt in 1 2 3 4 5; do
            if [ -n "$(gh pr list --head "$branch" --state open --json number -q '.[0].number')" ]; then
              opened=1
              break
            fi
            if gh pr create --base main --head "$branch" \
              --title "chore: bump terminatr formula and cask to $VERSION" \
              --body "Generated by the release job for v$VERSION from its checksums.txt (scripts/release/formula.sh, cask.sh)."; then
              opened=1
              break
            fi
            echo "create attempt $attempt failed, retrying in 10s"
            sleep 10
          done
          if [ -z "$opened" ] && [ -z "$(gh pr list --head "$branch" --state open --json number -q '.[0].number')" ]; then
            echo "could not open the formula and cask PR for $VERSION — the release is published and" >&2
            echo "$branch is pushed, so open the pull request by hand." >&2
            exit 1
          fi

          git checkout --detach
          # Mergeability is computed asynchronously: retry. Without required
          # checks on main it merges here, before its ci.yml run finishes;
          # main's run on the merge commit is then the one that counts.
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$branch" --squash --subject "chore: bump terminatr formula and cask to $VERSION"; then
              git push origin --delete "$branch" || true
              exit 0
            fi
            echo "merge attempt $attempt failed, retrying in 10s"
            sleep 10
          done
          # A ruleset that requires checks or a review refuses the merge:
          # queue it with auto-merge (if the repository allows it), which
          # merges once its ci.yml checks pass.
          if gh pr merge "$branch" --auto --squash --subject "chore: bump terminatr formula and cask to $VERSION"; then
            echo "::notice::the formula PR for $VERSION merges once the rules on main pass (auto-merge is on); see docs/OPERATIONS.md, Releasing"
            exit 0
          fi
          echo "could not merge the formula bump for $VERSION — the release is published, but" >&2
          echo "Formula/terminatr.rb and Casks/terminatr-app.rb on main still name the previous version. Merge the PR by hand." >&2
          exit 1

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/tm-signing.keychain-db" || true

  # The iPhone app to TestFlight (scripts/release/ios.sh): archived with
  # the tag's version and its commit count as the build number, signed
  # with an Apple Distribution identity and an App Store profile (manual
  # signing: a CI runner has no Xcode account, and cloud signing would
  # make a certificate per run), exported and uploaded with an App Store
  # Connect API key. Prereleases go too: TestFlight is where they're
  # tried. Runs once the release is published, so a failure here leaves
  # the release as it is: rerun this job (a build number already
  # uploaded is refused; that one is there). Skipped while none of its
  # secrets is set. On the xcode-27 image (a preview: it may queue), for
  # the iOS 27.1 SDK the iPhone Duo layout needs (T824); the Mac app's
  # jobs stay on macos-latest.
  testflight:
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.published == 'true' && needs.release.outputs.testflight == 'true' }}
    runs-on: xcode-27
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The build number is the commit count.
          fetch-depth: 0

      # The app's packages compile no shader today, but TerminatrUI is
      # the Mac app's too: as macos-app in ci.yml.
      - name: Metal toolchain
        run: |
          xcodebuild -version
          xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
          xcrun metal --version

      - name: Import signing certificate and profile
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          missing=
          for v in CERT_P12_BASE64 CERT_PASSWORD PROFILE_BASE64 KEYCHAIN_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "TestFlight secrets missing:$missing (CERT_* and PROFILE_* are IOS_DIST_CERT_*, IOS_PROFILE_BASE64; ios/README.md, TestFlight)" >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/tm-ios.keychain-db"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/tm-ios.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$RUNNER_TEMP/tm-ios.p12" -k "$keychain" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          # Without this codesign blocks on a GUI keychain prompt and the job hangs.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/tm-ios.p12"
          # Xcode signs with "Apple Distribution" of the project's team
          # (DEVELOPMENT_TEAM, ios/Terminatr.xcodeproj): one must be valid,
          # its WWDR intermediate in the .p12 or on the runner.
          team=$(sed -n 's/^[[:space:]]*DEVELOPMENT_TEAM = \([A-Z0-9]*\);$/\1/p' ios/Terminatr.xcodeproj/project.pbxproj)
          identities=$(security find-identity -v -p codesigning "$keychain")
          if ! printf '%s\n' "$identities" | grep -q "\"Apple Distribution: .* ($team)\""; then
            echo "no valid Apple Distribution identity of team $team in IOS_DIST_CERT_P12_BASE64" >&2
            exit 1
          fi
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/tm-ios.mobileprovision"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/tm-asc.p8"

      - name: Archive and upload
        env:
          TM_IOS_PROFILE: ${{ runner.temp }}/tm-ios.mobileprovision
          TM_ASC_KEY: ${{ runner.temp }}/tm-asc.p8
          TM_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          TM_ASC_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: scripts/release/ios.sh "$GITHUB_REF_NAME"

      - name: Clean up
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/tm-ios.keychain-db" || true
          rm -f "$RUNNER_TEMP/tm-ios.mobileprovision" "$RUNNER_TEMP/tm-asc.p8"

  # The relay image, for amd64 and arm64, built by deploy/relay/Dockerfile
  # from this release's published linux archives, checked against its
  # checksums.txt, as `docker build` anywhere does: the image holds exactly
  # the released binary. Tagged with the version and, unless a prerelease,
  # latest. It runs once the release is published, even if the formula
  # bump after that failed. A failure here leaves the release published;
  # rerun this job.
  image:
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    # No environment: it only holds the Apple secrets, which this job doesn't
    # use (GITHUB_TOKEN only). The job is gated by needs: release, which runs
    # only on a v* tag.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Tags
        id: tags
        env:
          PRERELEASE: ${{ needs.release.outputs.prerelease }}
        run: |
          image=ghcr.io/theclifmeister/tm-relay
          tags="$image:$GITHUB_REF_NAME"
          if [ "$PRERELEASE" = false ]; then
            tags="$tags,$image:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      # arm64's build stage runs the binary (tm version) under emulation.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/relay
          platforms: linux/amd64,linux/arm64
          build-args: TM_VERSION=${{ github.ref_name }}
          tags: ${{ steps.tags.outputs.tags }}
          push: true
