name: release-setup
description: >
  What the release build (.goreleaser.yaml) needs: Go, the pinned Zig and
  the per-target libghostty-vt builds (both cached), pkg-config,
  goreleaser, and for the Mac app Xcode's Metal toolchain. Run after
  checkout, on macOS.

runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: go.mod

    - name: Pins
      id: pins
      shell: bash
      run: scripts/release/pins.sh >> "$GITHUB_OUTPUT"

    - name: Cache Zig
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .build/zig-*
        key: zig-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.zig }}

    - name: Cache release libghostty-vt
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          .build/release/ghostty-*
          !.build/release/ghostty-src
        key: ghostty-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.ghostty }}-${{ hashFiles('scripts/release/targets.sh') }}

    - name: pkg-config
      shell: bash
      run: command -v pkg-config || brew install pkgconf

    # Ghostty's Zig dependencies (make ghostty-deps), so a build doesn't
    # download them from deps.files.ghostty.org, which drops connections
    # now and then (T806). Fetched here only when the cache has none,
    # i.e. once per Ghostty pin: main's runs keep it, and a release tag
    # can restore only what main saved.
    - name: Zig package cache dir
      shell: bash
      run: echo "ZIG_GLOBAL_CACHE_DIR=$HOME/.cache/zig" >> "$GITHUB_ENV"

    - name: Cache Ghostty's Zig dependencies
      id: zigpkgs
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/zig/p
        key: zig-pkgs-${{ runner.os }}-${{ steps.pins.outputs.zigpkgs }}

    - name: Fetch Ghostty's Zig dependencies
      if: steps.zigpkgs.outputs.cache-hit != 'true'
      shell: bash
      run: make ghostty-deps

    - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
      with:
        install-only: true
        version: ${{ steps.pins.outputs.goreleaser }}

    # The Mac app (scripts/release/app.sh): SwiftTerm compiles a Metal
    # shader, and Xcode 26+ ships the Metal toolchain as a separate
    # component.
    - name: Metal toolchain
      shell: bash
      run: |
        xcodebuild -version
        xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
        xcrun metal --version
