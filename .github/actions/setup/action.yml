name: setup
description: >
  Go, the pinned Zig and libghostty-vt (both cached) and pkg-config: what
  `make build`, `make test` and the e2e harness need. Run after checkout.

runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: go.mod

    # No setup-zig: `make` fetches the pinned Zig into .build/ (sha256-
    # checked) unless a Zig 0.16 is already on PATH. Cached on its own,
    # keyed on the Zig pin in the Makefile.
    - name: Pins
      id: pins
      shell: bash
      run: scripts/release/pins.sh >> "$GITHUB_OUTPUT"

    - name: Cache Zig
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .build/zig-*
        key: zig-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.zig }}

    - name: pkg-config
      shell: bash
      run: command -v pkg-config || brew install pkgconf

    # Ghostty's Zig dependencies (make ghostty-deps), so a build doesn't
    # download them from deps.files.ghostty.org, which drops connections
    # now and then (T806). Fetched here only when the cache has none,
    # i.e. once per Ghostty pin: main's runs keep it, and a release tag
    # can restore only what main saved.
    - name: Zig package cache dir
      shell: bash
      run: echo "ZIG_GLOBAL_CACHE_DIR=$HOME/.cache/zig" >> "$GITHUB_ENV"

    - name: Cache Ghostty's Zig dependencies
      id: zigpkgs
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/zig/p
        key: zig-pkgs-${{ runner.os }}-${{ steps.pins.outputs.zigpkgs }}

    - name: Fetch Ghostty's Zig dependencies
      if: steps.zigpkgs.outputs.cache-hit != 'true'
      shell: bash
      run: make ghostty-deps

    # libghostty-vt only changes with the Ghostty pin (and the Zig that
    # builds it), so its cache is keyed on those lines alone: other
    # Makefile edits don't force a rebuild. The checkout path is in the
    # key too: the build's pkg-config files name their absolute prefix,
    # which moved when the repository was renamed.
    - name: Cache libghostty-vt
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          .build/ghostty-*
          !.build/ghostty-src
        key: ghostty-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.ghostty }}

    - name: toolchain
      shell: bash
      run: |
        make toolchain
        echo "zig on PATH: $(command -v zig || echo none)"
