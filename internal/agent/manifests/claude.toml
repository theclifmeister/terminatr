# Claude Code: the reference agent manifest (docs/SPEC.md §8.6).
#
# First verified on Claude Code 2.1.289 on macOS by the integration spike
# (t-0004, docs/research/claude.md) and the symlink spike (t-0005).
# Several sources below are undocumented by Anthropic (the session status
# file, the task snapshot dir): any version is trusted, and what it
# writes is checked instead (an unknown status distrusts the file); the
# core falls back to hooks, transcript and screen (docs/SPEC.md §8.8).

manifest_version = 1
name = "claude"
display = "Claude Code"
role_files = ["CLAUDE.md"]

# Read from every hook event, latest wins: /clear rotates Claude's id.
session_field = "session_id"

# Subagent events carry agent_id. They must not move the pane's state, but
# the SubagentStart/SubagentStop counters below still see them.
ignore_fields = ["agent_id"]

[identify]
argv0 = ["claude"]
version_args = ["--version"]
# Exec-form hooks (command + args) need Claude Code 2.1.139. tm doctor
# warns below this.
min_version = "2.1.139"
min_version_why = "exec-form hooks need 2.1.139: on older versions the hooks don't run and threads lose hook state"
# Information only, never a gate: a newer Claude is supported until
# something breaks, and tm logs the drift it sees (docs/SPEC.md §8.8).
last_tested = "2.1.296"

[launch]
command = "claude"
# Hooks (--plugin-dir) and --settings are additive to the user's own
# settings. --session-id only for fresh sessions: reusing an id fails.
# The brief survives /clear as an appended system prompt.
# tm mcp is the MCP server "terminatr" for the typed tools (docs/SPEC.md
# §8.6, tm mcp). --mcp-config is additive to the user's own servers.
args = [
  "--plugin-dir", "{{.RuntimeDir}}/claude-plugin",
  "--settings", "{{.RuntimeDir}}/claude-settings.json",
  "--mcp-config", "{{.RuntimeDir}}/claude-mcp.json",
  "{{if not .Resume}}--session-id{{end}}", "{{if not .Resume}}{{.AgentSID}}{{end}}",
  "{{if .BriefPath}}--append-system-prompt-file{{end}}", "{{.BriefPath}}",
]
resume_args = ["--resume", "{{.AgentSID}}"]
yolo_args = ["--dangerously-skip-permissions"]
model_args = ["--model", "{{.Model}}"]
# Several Claude flags are variadic (--allowedTools, --add-dir, ...) and
# swallow a following positional prompt, so the kickoff goes after "--".
kickoff_args = ["--", "{{.Kickoff}}"]
# A Claude started from inside another Claude believes it is a child
# session (e.g. transcripts aren't saved). Drop the inherited session
# variables, but not CLAUDE_CODE_* as a whole: that prefix also carries
# user configuration such as CLAUDE_CODE_USE_BEDROCK.
unset_env = [
  "CLAUDECODE", "CLAUDE_PID", "CLAUDE_EFFORT",
  "CLAUDE_CODE_ENTRYPOINT", "CLAUDE_CODE_EXECPATH", "CLAUDE_CODE_CHILD_SESSION",
  "CLAUDE_CODE_SESSION_*", "CLAUDE_CODE_MESSAGING_*",
]

[launch.env]
# Claude 2.1.295 enables TaskCreate/TaskUpdate (there is no TodoWrite) only
# for legacy or unset models; current models get no todo tools without this,
# so the [[todos]] mapping would never fire.
CLAUDE_CODE_ENABLE_TODO_TOOLS = "1"
TERMINATR_SESSION = "{{.SessionID}}"
TERMINATR_SOCKET = "{{.Socket}}"
TERMINATR_BIN = "{{.TMBin}}"
# A thread's own temp folder (T587): Claude keeps its scratchpads, task
# output and its sandbox's TMPDIR in $CLAUDE_CODE_TMPDIR/claude-<uid>,
# else /tmp/claude-<uid>, which all the user's sessions share. TMPDIR
# for what Claude runs outside its sandbox (hooks, MCP servers).
CLAUDE_CODE_TMPDIR = "{{.TempDir}}"
TMPDIR = "{{.TempDir}}"

[[launch.files]]
path = "claude-plugin/.claude-plugin/plugin.json"
template = '''
{"name": "terminatr", "description": "terminatr session hooks", "version": "0.1.0"}
'''

# Every event goes to `tm hook --agent claude`: a command hook in exec form
# ("command" is the tm binary, "args" its arguments: no shell on any OS, so
# no quoting; Claude >= 2.1.139, [identify] min_version) (an http hook
# shows a red error in Claude's UI whenever the server is down), synchronous
# so events stay in order (~4 ms each), always exit 0, never stderr.
# Every event the [[hooks]], [[todos]] and todos_snapshot below name
# (.HookEvents), and no other: an event no entry maps would be a process
# spawn for nothing.
[[launch.files]]
path = "claude-plugin/hooks/hooks.json"
template = '''
{{- $cmd := hookexec .TMBin "hook" "--agent" "claude" -}}
{{- $h := printf `[{"hooks":[{"type":"command",%s,"timeout":5}]}]` $cmd -}}
{"hooks": {
{{- range $i, $ev := .HookEvents}}{{if $i}},{{end}}
  {{json $ev}}: {{$h}}
{{- end}}
}}
'''

# tm mcp for the typed tools ([launch] args). Claude runs MCP servers
# outside its sandbox, with its own environment (tm mcp finds the
# session by its parents).
[[launch.files]]
path = "claude-mcp.json"
template = '''
{"mcpServers": {"terminatr": {"type": "stdio", {{hookexec .TMBin "mcp"}}}}}
'''

# A coordinator's /saveclear and /answer: plain plugin commands, so
# Claude offers them;
# the UserPromptSubmit hook carries the typed command first, and the
# server runs it (tm clear, tm ask open) and blocks the prompt with what
# came of it ([[hooks]] command below), so the model never sees it.
# The text is what the model reads only when the server didn't answer.
[[launch.files]]
path = "claude-plugin/commands/saveclear.md"
template = '''
{{- if eq .Role "coordinator"}}---
description: Save what the coordinator learned, then clear its conversation (tm clear)
---
tm didn't take /saveclear. Run `tm clear` in the shell and say in one line what it printed.
{{end}}'''

[[launch.files]]
path = "claude-plugin/commands/answer.md"
template = '''
{{- if eq .Role "coordinator"}}---
description: Open the coordinator's questions to you in a dialog
---
tm didn't take /answer. Run `tm ask open` in the shell and say in one line what it printed.
{{end}}'''

# Access policy (docs/SPEC.md §5.2). Rules name real paths, because Claude
# resolves symlinks first. On Windows Claude matches POSIX-form paths, so
# C:\Users\a is written //c/Users/a (the rules function converts it). Only Edit(...) deny rules: they cover Write, Edit
# and NotebookEdit, while Write(...) rules aren't matched by file checks.
# NoRead (other sessions' temp folders) is the sandbox's denyRead, the
# thread's own temp folder (OwnTemp) its allowRead within; and, for those
# that don't hold OwnTemp (.Access.Closed), a Read(...) and an Edit(...)
# deny, which keep file tools out too. File tools elsewhere outside the
# worktree ask first.
# Edit(...) allow rules also open the Bash sandbox for writing (a thread's
# commits go to the parts of the main repo's git dir they need), and
# Edit(...) deny rules close it, within a broader grant too (the main
# repo's git hooks, config and info, the other worktrees' git dirs).
# Claude's sandbox writes the whole main git dir from a linked worktree,
# so the git dirs of worktrees added after the launch are closed by name
# patterns (.Access.NoWriteSiblings, siblingRules): each pattern matches
# the folder itself and all below it, so it can't be made, written or
# moved into place.
# mcp__terminatr lets tm mcp's tools run without a prompt; not when
# Claude's own config has a server "terminatr", or may (.MCPClash): then
# they are an ask rule, which comes before any allow rule of the user's
# or the folder's own.
# disableAllHooks is pinned false: the hooks are how tm sees the session
# and guards its tool calls, and --settings wins over the user's and the
# folder's own settings (checked live on 2.1.306: a plugin hook that the
# user's settings.json, the folder's .claude/settings.json or its
# settings.local.json turned off with disableAllHooks: true ran again
# with this pin). Claude's managed settings win over it; tm doctor and
# the launch warn of those (internal/agent/claude/hooks.go).
# Never put statusLine here: --settings would replace the user's own.
# Outside safe mode Claude draws with tm's own theme in its config dir
# ([theme] below, docs/SPEC.md §8.6), which the server rewrites on every
# theme or scheme change and Claude reloads live (2.1.296); a --settings
# theme wins over the user's, and is read only at start or resume. When
# the server can't write that theme (.LiveTheme false), a pane palette
# (.PaneScheme, §5.3) still gets Claude's ANSI theme, which the palette
# colours: its own themes are truecolor, which panes pass through.
# At protection strict (no escapes), a thread's Bash can't leave the sandbox
# (allowUnsandboxedCommands): a command run outside it would reach the
# human socket (§3.2), whoever approved it.
# A thread's sandbox lists (.Sandbox, the human's [projects.<slug>.sandbox])
# add its excludedCommands, which run outside the sandbox even with
# escapes off, and allow rules after tm's: Claude merges lists
# across settings files, and its deny rules (tm's) win over any allow.
# Its local ports (macOS only, which the server checks) are
# allowLocalBinding: sandboxed commands may listen on and reach localhost;
# their domains (its host rules) are allowedDomains,
# which sandboxed commands reach without a prompt (Claude merges the
# list with the user's own).
# Yolo (T574 case 4) means no sandbox and no prompts: a yolo thread's
# sandbox is off (enabled false, which a --settings file sets over the
# project's and the user's own true: T577) beside yolo_args, so its
# lists aren't written; the Edit deny rules above still are, and the
# guard keeps its floor. Protection below sandboxed (.NoSandbox) turns
# the sandbox off the same way but keeps Claude's own prompts: the
# agent as it runs on its own.
[[launch.files]]
path = "claude-settings.json"
template = '''
{
  {{- if .LiveTheme}}
  "theme": "custom:terminatr",
  {{- else if .PaneScheme}}
  "theme": {{json (printf "%s-ansi" .PaneScheme)}},
  {{- end}}
  "disableAllHooks": false,
  "permissions": {
    "allow": {{json (concat (list (not .MCPClash) "mcp__terminatr") (rules "Read(/%s/**)" .Access.Read) (rules "Edit(/%s/**)" .Access.Write) (rules "Edit(/%s)" .Access.WriteFiles) (rules "Bash(%s:*)" .Access.Commands) .Sandbox.Allow)}},
    "ask": {{json (list .MCPClash "mcp__terminatr")}},
    "deny": {{json (concat (rules "Edit(/%s/**)" .Access.NoWrite) (rules "Edit(/%s)" .Access.NoWriteFiles) (siblingRules "Edit(/%s)" .Access.NoWriteSiblings) (rules "Read(/%s/**)" .Access.Closed) (rules "Edit(/%s/**)" .Access.Closed))}}
  },
  "sandbox": {
    {{- if and (eq .Role "thread") (or .Yolo .NoSandbox)}}
    "enabled": false,
    {{- else if eq .Role "thread"}}
    "enabled": true,
    {{- if .NoSandboxEscapes}}
    "allowUnsandboxedCommands": false,
    {{- end}}
    {{- if .Sandbox.Excluded}}
    "excludedCommands": {{json .Sandbox.Excluded}},
    {{- end}}
    {{- if .Access.NoRead}}
    "filesystem": {"denyRead": {{json .Access.NoRead}}{{if .Access.OwnTemp}}, "allowRead": [{{json .Access.OwnTemp}}]{{end}}},
    {{- end}}
    {{- end}}
    "network": {"allowUnixSockets": [{{json .Socket}}{{if and (eq .Role "thread") (not .Yolo) (not .NoSandbox)}}{{range .Sandbox.Sockets}}, {{json .}}{{end}}{{end}}]
      {{- if and (eq .Role "thread") (not .Yolo) (not .NoSandbox) .Sandbox.LocalBinding}}, "allowLocalBinding": true{{end}}
      {{- if and (eq .Role "thread") (not .Yolo) (not .NoSandbox) .Sandbox.Domains}}, "allowedDomains": {{json .Sandbox.Domains}}{{end}}}
  }
}
'''

# The tm theme as Claude's (docs/SPEC.md §8.6): custom:terminatr, which
# the settings file selects, at <config dir>/themes/terminatr.json
# (CLAUDE_CONFIG_DIR, else ~/.claude), a file tm owns: Claude watches
# that folder and redraws with a rewritten theme at once. Under a pane
# palette (.Theme) its base is Claude's ANSI theme, whose 16 colours
# the pane palette sets, so a token it doesn't name follows the palette; the ones it names take the theme's roles
# and the palette's foreground and background exactly, in truecolor:
# the accent for Claude's own colour, good/bad/warn/info for its
# states, faint for what's dimmed, and backgrounds a shade off the
# pane's (the selection's too: Claude draws its text over it, not sel's
# fg). A colour the theme doesn't give is left out (the base's).
# Without one it is Claude's ANSI theme for the scheme under the
# built-in tm theme (follow terminal: .Base dark-ansi or light-ansi), so
# Claude takes the terminal's own colours, else the user's own Claude
# theme (.Base, .Overrides, which the server reads from their settings
# and themes), so the panes look as they would without tm. Claude ignores a token or colour it
# doesn't know.
[theme]
path = "themes/terminatr.json"
template = '''
{{- with .Theme -}}
{{- $fg := or .PaneFg .Fg.plain -}}
{{- $bg := .PaneBg -}}
{{- $accent := or .Fg.accent .Fg.title -}}
{{- $faint := or .Fg.faint (index .ANSI 8) -}}
{{- $green := or .Fg.good (index .ANSI 2) -}}
{{- $red := or .Fg.bad (index .ANSI 1) -}}
{"name": "terminatr", "base": {{json (printf "%s-ansi" .Scheme)}}, "overrides": {{colors
  "claude" $accent "claudeShimmer" (blend $accent $fg 30) "clawd_body" $accent "briefLabelClaude" $accent
  "text" $fg "inverseText" $bg "clawd_background" $bg
  "inactive" $faint "inactiveShimmer" (blend $faint $fg 30) "subtle" $faint
  "promptBorder" $faint "promptBorderShimmer" (blend $faint $fg 30)
  "success" .Fg.good "error" .Fg.bad "warning" .Fg.warn "warningShimmer" (blend .Fg.warn $fg 30)
  "suggestion" .Fg.info "permission" .Fg.info "permissionShimmer" (blend .Fg.info $fg 30)
  "ide" .Fg.info "briefLabelYou" .Fg.info "rate_limit_fill" .Fg.info "rate_limit_empty" (blend $bg .Fg.info 30)
  "selectionBg" (or (blend $bg .Bg.sel 45) (blend $bg $fg 25))
  "userMessageBackground" (blend $bg $fg 8) "userMessageBackgroundHover" (blend $bg $fg 12)
  "composerSidebarBackground" (blend $bg $fg 5)
  "bashMessageBackgroundColor" (blend $bg (index .ANSI 5) 12) "memoryBackgroundColor" (blend $bg (index .ANSI 6) 12)
  "diffAdded" (blend $bg $green 35) "diffRemoved" (blend $bg $red 35)
  "diffAddedDimmed" (blend $bg $green 15) "diffRemovedDimmed" (blend $bg $red 15)
  "diffAddedWord" (blend $bg $green 60) "diffRemovedWord" (blend $bg $red 60)
}}}
{{- else -}}
{"name": "terminatr", "base": {{json .Base}}, "overrides": {{json .Overrides}}}
{{- end}}
'''

# The guard (docs/SPEC.md §8.6): Claude's login, where it isn't in the
# macOS keychain (CLAUDE_CONFIG_DIR moves it), and the folders a thread
# writes outside its worktree: plan mode's plans and its own memory.
[guard]
secrets = [".claude/.credentials.json", "$CLAUDE_CONFIG_DIR/.credentials.json"]
writable = [".claude/plans", ".claude/projects", "$CLAUDE_CONFIG_DIR/plans", "$CLAUDE_CONFIG_DIR/projects"]
# Its Bash tool sources the session's snapshot of the user's shell before
# each command: no session writes them (the guard's floor).
shell_state = [".claude/shell-snapshots", "$CLAUDE_CONFIG_DIR/shell-snapshots"]
# The sandbox's TMPDIR: $CLAUDE_CODE_TMPDIR/claude-<uid>, else /tmp/claude-<uid>
# (a thread's: in its own temp folder, [launch.env]).
temp = ["$CLAUDE_CODE_TMPDIR/claude-{uid}", "/tmp/claude-{uid}"]
# Its sandbox keeps Bash from this one (a read deny).
temp_private = ["bash-edit-diff"]
# The permission dialog of a command run outside the sandbox (the rule
# below): an escape, the user's to answer, marked or not.
escape_rule = "blocked-escape-dialog"
# Shared by all its sessions: a thread may name only its own scratchpad.
temp_scratch = true
# The sandbox's TMPDIR is the per-uid folder only up to 44 bytes (AF_UNIX
# socket paths), else /tmp/claude-<uid> (2.1.302).
temp_max = 44

# The tools the guard judges, by kind, and the input fields each reads.
# PowerShell is Claude's shell tool on Windows without Git Bash.
[guard.tools]
# A Bash call with dangerouslyDisableSandbox asks to run outside the
# sandbox (T577: the flag is in the hook's input): the guard puts it to
# the user, never the coordinator (T574 case 6).
Bash = { kind = "shell", fields = ["command"], escape = "dangerouslyDisableSandbox" }
PowerShell = { kind = "shell", syntax = "powershell", fields = ["command"] }
Edit = { kind = "write", fields = ["file_path"] }
Write = { kind = "write", fields = ["file_path"] }
MultiEdit = { kind = "write", fields = ["file_path"] }
NotebookEdit = { kind = "write", fields = ["notebook_path"] }
Read = { kind = "read", fields = ["file_path"] }
# Grep's and Glob's path may be left out: the session's folder (optional).
Grep = { kind = "read", fields = ["path"], optional = ["path"] }
Glob = { kind = "glob", fields = ["pattern", "path"], optional = ["path"] }

# Remote Control (2.1.289): the Claude apps list the session under its
# name. /remote-control <name> turns it on in a running session. A resumed
# conversation reconnects on its own, flag or not, so off can't be a
# restart: /remote-control while connected opens a menu (Disconnect this
# session · Show QR code · Continue, on Continue), answered with Up Up
# Enter, and the transcript then says it disconnected.
[remote_control]
args = ["--remote-control", "{{.RemoteName}}"]
enable = "/remote-control {{.RemoteName}}"
disable = "/remote-control"
# The session file's bridgeSessionId is null while it is off.
status_field = "remote_control"
disable_dialog = { contains = "Disconnect this session", keys = "\u001b[A\u001b[A\r", done = "Remote Control disconnected" }

# tm thread answer (docs/SPEC.md §11.2): the coordinator relays the
# user's answer to an AskUserQuestion menu. A number picks that option;
# the last one, "Type something.", is a text field once focused: its
# number focuses it, then the text and Enter. The menu itself comes in
# AskUserQuestion's PreToolUse input (questions[], kept for the guard):
# the server shows it as the session's open question, and session.answer
# answers it with the same keys, one question at a time.
# A multi-select question (2.1.316, T900) draws a box before each option
# ("1. [ ] Apple", "[✔]" once ticked): its number toggles the box without
# moving the cursor, and an unnumbered row under the options, "Next"
# ("Submit" on a menu's only question), ends it: Down to it, then Enter.
# A menu of several questions, or with a multi-select, ends on a review
# step, "Review your answers" with "1. Submit answers · 2. Cancel" and no
# footer: tm picks Submit answers once it typed the last answer.
[answer]
rule = "blocked-question"
tool = "AskUserQuestion"
text_option = "Type something"
submit = "\r"
multi_done = ["Next", "Submit"]
down = "\u001b[B"
review = "Submit answers"
review_title = "Review your answers"

# session.approve (docs/SPEC.md §11.2): what a permission dialog's
# option allows. Read off 2.1.312's dialogs. The session ones are
# Claude's "during this session" rules, in memory only; Bash, MCP and
# WebFetch offer none ("don't ask again" writes .claude/settings.local.json).
# "for this session" options that edit Claude's own .claude folders, or
# switch the permission mode ("Yes, and switch to … for this session",
# "auto-accept edits"), allow more than the call asked: they match
# nothing below, so they count as persistent. So does any wording not
# listed ("Yes, and allow access to … commands", "keep allowing").
[approve]
persistent = ["don't ask again", "always", "from this project", "from now on", "remember"]
session = ['^Yes, allow reading from .+ during this session']
once = ['^Yes$', '^Yes, but ask again next time', '^No\b']

# The models (docs/SPEC.md §8.2, Models): tm ships none and asks Claude
# Code, as the Agent SDK does: a headless session's initialize control
# request answers with Claude's own /model list for this user (their
# login, plan, provider, availableModels and ANTHROPIC_DEFAULT_*_MODEL),
# without a prompt, so no model call. --safe-mode leaves the user's
# hooks, plugins and MCP servers out; settings and policy still apply.
# Checked on 2.1.296 (Max login, logged out, API key, Bedrock, Vertex).
[list_models]
args = ["-p", "--safe-mode", "--no-session-persistence", "--input-format", "stream-json", "--output-format", "stream-json", "--verbose"]
send = ['{"type":"control_request","request_id":"tm-models","request":{"subtype":"initialize"}}']

[list_models.models]
reply = { type = "control_response", "response.request_id" = "tm-models" }
path = "response.response.models"
name = "value"
display = "displayName"
description = "description"
resolves_to = "resolvedModel"
# "default" is the user's own default, which passing no --model gives.
skip = { value = "default" }
# The fixed versions behind the aliases (claude-opus-4-8, …).
older_pinned = true

[list_models.models.tags]
"no auto mode" = { supportsAutoMode = "false" }

[list_models.account]
reply = { type = "control_response", "response.request_id" = "tm-models" }
path = "response.response.account"
fingerprint = ["apiProvider", "subscriptionType", "organization", "tokenSource", "apiKeySource"]
label = ["subscriptionType", "apiProvider"]
# No login and no API key: Claude then lists its aliases only.
logged_out = { "response.response.account.tokenSource" = "none", "response.response.account.apiKeySource" = "!*", "response.response.account.apiProvider" = "firstParty" }

[inject]
# Bracketed paste + Enter while idle with an empty prompt box (core).
# Claude's undocumented uds-messaging socket (Go, internal/agent/claude)
# presents a message as coming from "another Claude session … not typed
# by your user", can't run slash commands and never acknowledges, so
# prompts from the human or the coordinator are always pasted; the
# socket only carries tm's own fixed-word prompts once held (§8.6).
prompt = "paste"
# tm hook passes this variable from the hook's environment to the server:
# Claude 2.1.291's socket may require an auth line, and the token it gives
# its children is valid there. Kept in memory only.
token_env = "CLAUDE_CODE_MESSAGING_TOKEN"
# Paste only into an empty box: after an Esc, Claude puts the cancelled
# prompt back, and a paste would be appended to it.
empty_rule = "idle-empty-box"
# What auto_clear pastes into an idle coordinator past its context hint.
clear = "/clear"
# A coordinator_model change applies live: /model takes the model as its
# argument, a local command (no model call) that keeps the conversation
# ("Set model to `Sonnet 5.5` for this session only", checked on 2.1.296;
# "default" is the user's own default).
switch_model = "/model {model}"
switch_model_default = "default"
# tm thread prompt --interrupt (checked on 2.1.302, T569): a prompt typed
# mid-turn is queued; Esc then stops the turn and Claude sends what it
# queued at once, as a turn of its own. So the prompt is pasted first.
# Waiting for idle after a bare Esc would race that send (the status
# file reads idle for about a second in between).
interrupt = "\u001b"
interrupt_paste = "before"

# Hook payloads are trimmed before they leave the hook process.
[hook]
keep = [
  "session_id", "transcript_path", "cwd", "permission_mode", "source", "reason",
  "notification_type", "tool_name", "tool_use_id", "agent_id", "agent_type",
  "prompt", "last_assistant_message", "task_id", "task_subject",
]
truncate = { prompt = 500, last_assistant_message = 500 }

[[hook.keep_when]]
match = { tool_name = "TaskCreate" }
fields = ["tool_input", "tool_response"]

[[hook.keep_when]]
match = { tool_name = "TaskUpdate" }
fields = ["tool_input", "tool_response"]

[[hook.keep_when]]
match = { tool_name = "TodoWrite" }
fields = ["tool_input"]

# The guard judges each tool call from its input (Bash's command, the file
# tools' paths): the hook is its only way in.
[[hook.keep_when]]
match = { hook_event_name = "PreToolUse" }
fields = ["tool_input"]

# Primary state: Claude's own session file, written atomically on every
# change. It clears the cases where no hook fires (Esc on a dialog, while
# streaming, during a tool).
[status_file]
path = "{{.ConfigDir}}/sessions/{{.PID}}.json"
state_field = "status"
# "shell" (2.1.289, t-0034): idle at the prompt while a background shell
# runs ("1 shell still running"). Unknown values distrust the whole file.
state_map = { idle = "idle", shell = "idle", busy = "working", waiting = "blocked" }
reason_field = "waitingFor"
reason_map = { "permission prompt" = "permission", "input needed" = "question" }
session_field = "sessionId"
version_field = "version"
fields = { messaging_socket = "messagingSocketPath", remote_control = "bridgeSessionId" }

# Cross-check when the status file is missing or untrusted.
# Only Claude's own transcript of this session is followed: under its
# projects folder, named for the session id the event gave.
[jsonl_tail]
path_field = "transcript_path"
root = "{{.ConfigDir}}/projects"
name = "{{.AgentSID}}.jsonl"

# Usage (T646, checked on 2.1.306 transcripts): each
# model request is one or more assistant lines, one per content block,
# all with the same message.id and the same usage, so the id tells a
# repeat. input_tokens is the uncached part; the context is the whole
# input, cache reads and writes included. The transcript gives no window
# and no cost: context_windows lists only models whose window is fixed,
# 1M as their default and only one (the API's Models table, 2026-10),
# by exact id. Any other is left to the server's guess, 200K unless the
# id or the context says more (the 4.x models' 1M depends on the plan
# and on [1m], which the transcript doesn't show), so the % errs high
# and auto_clear and the hint come on time. A Claude session's tokens
# have no cost. One turn per turn_duration, which ends every finished
# turn. A subagent writes its own transcript, which isn't read.
[jsonl_tail.usage]
match = { type = "assistant" }
input = "message.usage.input_tokens"
cache_read = "message.usage.cache_read_input_tokens"
cache_creation = "message.usage.cache_creation_input_tokens"
output = "message.usage.output_tokens"
context_from_counts = true
model = "message.model"
key = "message.id"
turn = { type = "system", subtype = "turn_duration" }

[jsonl_tail.usage.context_windows]
"claude-fable-5" = 1_000_000
"claude-fable-5-1" = 1_000_000
"claude-mythos-5" = 1_000_000
"claude-mythos-5-1" = 1_000_000
"claude-opus-5" = 1_000_000
"claude-opus-5-5" = 1_000_000
"claude-sonnet-5" = 1_000_000
"claude-sonnet-5-5" = 1_000_000
"claude-haiku-5-5" = 1_000_000

[[jsonl_tail.rules]]
match = { type = "user" }
text_field = "message.content"
text_prefix = "[Request interrupted by user"
state = "idle"
reason = "interrupted"

[[jsonl_tail.rules]]
match = { type = "system", subtype = "turn_duration" }
state = "idle"

# A model the user's account or provider can't use: Claude writes an API
# error message with error "model_not_found" (checked in 2.1.296: "There's
# an issue with the selected model (X). It may not exist or you may not
# have access to it.", or "not available on your bedrock deployment").
[[jsonl_tail.refused]]
match = { type = "assistant", error = "model_not_found" }
text_field = "message.content"

# The conversation view (docs/SPEC.md §3.3, Transcript): transcript.watch
# reads the transcript as items. Checked on 2.1.302-2.1.310 transcripts
# (recorded in internal/agent/testdata/transcripts, whose drift test
# reads them): a "user" line's message.content is the prompt as a string,
# or blocks (text, image, tool_result); an "assistant" line holds one
# block (thinking, text or tool_use) per line. Subagents' lines
# (isSidechain) and Claude's own (isMeta: caveats, skill bodies) aren't
# the conversation. A prompt in tags is a command, a hook's or a task's
# notice (<command-name>, <task-notification>…), not typed. Other line
# types (attachment, system, ai-title…) aren't conversation lines.
[transcript]
tested = ["2."]
version_field = "version"
time_field = "timestamp"
content = "message.content"
block_kind = "type"
string_block = "text"
ignore = ["thinking", "redacted_thinking", "image", "tool_reference", "document"]

[[transcript.items]]
kind = "note"
match = { type = "user", isSidechain = "!true", isMeta = "!true" }
block = "text"
text = "text"
prefix = ["[Request interrupted by user"]
note = "Interrupted"

[[transcript.items]]
kind = "skip"
match = { type = "user", isSidechain = "!true" }
block = "text"
text = "text"
prefix = ["<", "[Image"]

[[transcript.items]]
kind = "skip"
match = { type = "user", isSidechain = "!true", isMeta = "true" }
block = "text"

[[transcript.items]]
kind = "prompt"
match = { type = "user", isSidechain = "!true" }
block = "text"
text = "text"

[[transcript.items]]
kind = "result"
match = { type = "user", isSidechain = "!true" }
block = "tool_result"
id = "tool_use_id"
text = "content"
error = "is_error"

[[transcript.items]]
kind = "text"
match = { type = "assistant", isSidechain = "!true" }
block = "text"
text = "text"

[[transcript.items]]
kind = "tool"
match = { type = "assistant", isSidechain = "!true" }
block = "tool_use"
id = "id"
name = "name"
input = "input"

[transcript.tool_args]
Bash = "command"
Read = "file_path"
Write = "file_path"
Edit = "file_path"
MultiEdit = "file_path"
NotebookEdit = "notebook_path"
Grep = "pattern"
Glob = "pattern"
WebFetch = "url"
WebSearch = "query"
Task = "description"
Agent = "description"
Skill = "skill"
TaskCreate = "subject"
TaskUpdate = "subject"
ToolSearch = "query"
SendUserFile = "caption"

# An answered question menu (AskUserQuestion's result): its text says
# "Your questions have been answered: "Q"="A", …" (before 2.1.3xx "User
# has answered your questions: …"), and the line's toolUseResult has the
# call's questions, the answers by question text and the user's notes
# (2.1.316).
[transcript.answers]
text_prefix = ["Your questions have been answered:", "User has answered your questions:"]
result = "toolUseResult"
questions = "questions"
answers = "answers"
notes = "annotations"

# What the conversation puts in front of the user (the app's attachment
# cards, session.file): SendUserFile's files, and images pasted into a
# prompt (their base64 bytes are in the line).
[transcript.files]
tool = "SendUserFile"
paths = "files"
display = "display"
image_block = "image"
image_type = "source.media_type"
image_data = "source.data"

# Hook → state: edges and details (who is asking for what).
[[hooks]]
event = "SessionStart"
state = "idle"
# Fires for startup, resume, clear, compact and fork; the context is
# fetched fresh from the server every time.
# tm hook waits up to 3 s for the context, not 500 ms (T94).
timeout = "context"
respond = '''{"hookSpecificOutput":{"hookEventName":"SessionStart","additionalContext":{{json .Context}}}}'''

[[hooks]]
event = "UserPromptSubmit"
state = "working"

# A coordinator's /saveclear and /answer (the plugin's
# commands, [[launch.files]] above): the server runs the command and the
# prompt is blocked with what came of it, which Claude shows the user
# (checked on 2.1.306: the hook gets the command as typed, before it
# expands). The turn never starts: idle again. In another session,
# .Command is "" and the prompt goes on: the entry sets no state, and
# the session is working as for any prompt. tm hook waits 3 s for the
# answer and sends the prompt once (timeout), so a command the server
# ran late never runs twice.
[[hooks]]
event = "UserPromptSubmit"
match = { prompt = "/saveclear" }
command = "saveclear"
state = "idle"
timeout = "command"
respond = '''{{with .Command}}{"decision":"block","reason":{{json .}}}{{end}}'''

[[hooks]]
event = "UserPromptSubmit"
match = { prompt = "/terminatr:saveclear" }
command = "saveclear"
state = "idle"
timeout = "command"
respond = '''{{with .Command}}{"decision":"block","reason":{{json .}}}{{end}}'''

[[hooks]]
event = "UserPromptSubmit"
match = { prompt = "/answer" }
command = "answer"
state = "idle"
timeout = "command"
respond = '''{{with .Command}}{"decision":"block","reason":{{json .}}}{{end}}'''

[[hooks]]
event = "UserPromptSubmit"
match = { prompt = "/terminatr:answer" }
command = "answer"
state = "idle"
timeout = "command"
respond = '''{{with .Command}}{"decision":"block","reason":{{json .}}}{{end}}'''

[[hooks]]
event = "PreToolUse"
state = "working"
transient = true
# The server's guard (internal/guard) judges each call
# and a refusal is the hook's answer, before any dialog; a PowerShell
# command it can't read is put to the dialog (or auto mode's classifier)
# with "ask". Allowed: no output, so Claude's own permission check decides.
# Without a verdict within 3 s (no server, a timeout, a payload tm hook
# can't read), tm hook answers with the refusal "tm couldn't check this
# call" (timeout = "guard"): the guard fails closed.
timeout = "guard"
respond = '''{{with .Guard}}{"hookSpecificOutput":{"hookEventName":"PreToolUse","permissionDecision":{{if .Ask}}"ask"{{else}}"deny"{{end}},"permissionDecisionReason":{{json .Message}}}}{{end}}'''

[[hooks]]
event = "PostToolUse"
state = "working"
transient = true

[[hooks]]
event = "PostToolUseFailure"
state = "working"
transient = true

# Compaction runs no turn hooks; the edge keeps a busy status file
# believed while it runs (docs/SPEC.md §8.4 rule 2).
[[hooks]]
event = "PreCompact"
state = "working"
transient = true

[[hooks]]
event = "PermissionRequest"
match = { tool_name = "AskUserQuestion" }
state = "blocked"
reason = "question"

[[hooks]]
event = "PermissionRequest"
match = { tool_name = "!AskUserQuestion" }
state = "blocked"
reason = "permission"

# Notifications arrive ~6 s after the dialog; late confirmations only.
[[hooks]]
event = "Notification"
match = { notification_type = "permission_prompt" }
state = "blocked"
reason = "permission"

[[hooks]]
event = "Notification"
match = { notification_type = "elicitation_dialog" }
state = "blocked"
reason = "question"

[[hooks]]
event = "Notification"
match = { notification_type = "agent_needs_input" }
state = "blocked"
reason = "question"

[[hooks]]
event = "Notification"
match = { notification_type = "idle_prompt" }
state = "idle"

[[hooks]]
event = "Stop"
state = "idle"

[[hooks]]
event = "StopFailure"
state = "idle"
reason = "error"

# Background subagents keep working after the main Stop. SubagentStop
# without agent_type is the prompt-suggestion side agent: no entry matches.
[[hooks]]
event = "SubagentStart"
match = { agent_type = "*" }
counter = "+bg"
counter_key = "agent_id"

[[hooks]]
event = "SubagentStop"
match = { agent_type = "*" }
counter = "-bg"
counter_key = "agent_id"

# /clear ends the session with reason=clear and starts a new one at once.
[[hooks]]
event = "SessionEnd"
match = { reason = "!clear" }
state = "exited"

# The context use is forgotten on /clear and after a compaction, until
# the next request reports it ([jsonl_tail.usage]):
# a coordinator's hint and auto-/clear don't act on the old fill.
[[hooks]]
event = "SessionEnd"
match = { reason = "clear" }
clears_context = true

[[hooks]]
event = "SessionStart"
match = { source = "compact" }
clears_context = true

# Todo mirroring (docs/SPEC.md §7.3). Claude 2.1 sends diffs through
# TaskCreate/TaskUpdate, one item per call. Subagents have no task tools.
[[todos]]
op = "upsert"
event = "PostToolUse"
match = { tool_name = "TaskCreate" }
id = "tool_response.task.id"
text = "tool_input.subject"
active_text = "tool_input.activeForm"
status_default = "pending"

[[todos]]
op = "upsert"
event = "PostToolUse"
match = { tool_name = "TaskUpdate" }
id = "tool_input.taskId"
text = "tool_input.subject"
active_text = "tool_input.activeForm"
status = "tool_input.status"
status_map = { deleted = "@remove" }  # "deleted" is inferred, not observed

# /clear starts a new, empty list (task ids restart at 1).
[[todos]]
op = "reset"
event = "SessionStart"
match = { source = "clear" }

# Older or other builds with a TodoWrite tool send the whole list.
[[todos]]
op = "replace"
event = "PostToolUse"
match = { tool_name = "TodoWrite" }
list = "tool_input.todos"
text = "content"
active_text = "activeForm"
status = "status"

# Claude's own copy of the list, re-read to heal the mirror.
[todos_snapshot]
dir = "{{.ConfigDir}}/tasks/{{.AgentSID}}"
glob = "*.json"
id = "id"
text = "subject"
status = "status"
on = ["Stop", "SessionStart"]

# Screen rules (2.1.289): blockers and the pre-hook screens only the screen
# can see. Highest priority wins.

# A dialog's words can be in the agent's own output too: a docs table it
# read, a test file it wrote (T743). So each blocker rule reads the
# dialog's shape where only a dialog draws it, at the bottom where the
# prompt box sits otherwise: its option on a line of its own, and its
# footer on (or within two rows of) the last row.

# The folder-trust dialog and the bypass warning (2.1.316): "❯ No, exit",
# "  Yes, I accept" (no numbers, which older builds drew), a blank row,
# "Enter to confirm · Esc to cancel" last. The bypass warning's title
# ("Bypass Permissions") is too far up, past wrapped text, to read here.
[[rules]]
id = "trust-folder"
state = "blocked"
reason = "trust"
priority = 50
region = "bottom:5"
contains = ["Enter to confirm"]
regex = '(?m)^[ \x{00A0}]*(?:[❯>][ \x{00A0}]+)?(?:\d+\.[ \x{00A0}]+)?Yes, I trust this folder[ \x{00A0}]*$'

[[rules]]
id = "trust-bypass-warning"
state = "blocked"
reason = "trust"
priority = 50
region = "bottom:5"
contains = ["Enter to confirm"]
regex = '(?m)^[ \x{00A0}]*(?:[❯>][ \x{00A0}]+)?(?:\d+\.[ \x{00A0}]+)?Yes, I accept[ \x{00A0}]*$'

[[rules]]
id = "transcript-view"
state = "unknown"
reason = "transcript view"
priority = 45
region = "bottom:3"
# Claude writes "Showing detailed transcript · <key> to toggle"; the
# lowercase "showing" this rule had never matched it (T190).
contains = ["detailed transcript"]

[[rules]]
id = "blocked-permission-dialog"
state = "blocked"
reason = "permission"
priority = 40
region = "screen"
contains = ["Do you want to ", "Esc to cancel"]
# Claude on Windows draws ">" for "❯" (its figures fallback). The
# dialog runs as long as its command, so the region is the screen, and
# the footer must close it.
regex = '(?ms)^[ \x{00A0}]*[❯>][ \x{00A0}]+1\. Yes.*^[^\n]*Esc to cancel[^\n]*(?:\n[^\n]*){0,2}\z'

# A permission dialog for a Bash call outside the sandbox: the guard's
# reason (its PreToolUse "ask": "asks to run outside the sandbox") or
# Claude's own ("Run outside of the sandbox", 2.1.302). [guard]
# escape_rule names it.
[[rules]]
id = "blocked-escape-dialog"
state = "blocked"
reason = "permission"
priority = 40
region = "screen"
contains = ["Do you want to ", "Esc to cancel"]
regex = '(?ms)(asks to run outside the sandbox|Run outside of the sandbox).*^[ \x{00A0}]*[❯>][ \x{00A0}]+1\. Yes.*^[^\n]*Esc to cancel[^\n]*(?:\n[^\n]*){0,2}\z'

[[rules]]
id = "blocked-question"
state = "blocked"
reason = "question"
priority = 40
region = "bottom:12"
contains = ["Enter to select", "to navigate", "Esc to cancel"]
regex = '(?m)^[^\n]*Enter to select[^\n]*(?:\n[^\n]*){0,2}\z'

[[rules]]
id = "working-title-spinner"
state = "working"
priority = 20
region = "title"
regex = '^[◐◑◒◓\x{2800}-\x{28FF}] '

[[rules]]
id = "working-spinner-line"
state = "working"
priority = 20
region = "bottom:8"
regex = '(?m)^\s*[*·✢✳✶✻✽]\s+\S+…\s+\('

# The ✳ title also shows while blocked, so it ranks below every blocker.
[[rules]]
id = "idle-title"
state = "idle"
priority = 5
region = "title"
regex = '^✳ '

[[rules]]
id = "idle-prompt-box"
state = "idle"
priority = 0
region = "bottom:10"
regex = '(?m)^\s*[❯>]'
skip_dim = true

# Not a state of its own (the box above already says idle): the paste
# injector checks it so it never appends to text left in the box. Ghost
# text (the dim prompt suggestion) doesn't count as typed. Claude puts a
# no-break space after the ❯, which \s doesn't cover. Mid-turn Claude
# draws the ❯ itself dim (2.1.306, T653), so with dim cells blanked an
# empty box is a blank row between the box's two rules: without that
# reading, tm thread prompt --now took every box for a draft and queued.
[[rules]]
id = "idle-empty-box"
state = "idle"
priority = 0
region = "bottom:10"
regex = '(?m)^\s*[❯>][\s\x{00A0}]*$|^─+\n[ \x{00A0}]*\n─+$'
skip_dim = true
