# Each action id to its keys (docs/SPEC.md §4 Action ids). The escape
# hatches (esc, ctrl+c, prefix+d, prefix+q, prefix+prefix) and the fixed
# actions (tab, the sidebar's esc and 1-9) aren't here: they can't be
# rebound. side.fold-all, side.unfold-all and side.needs-prev have no
# key by default (Z toggles the folds, W goes round the ends): a keymap
# may give them one.

"list.up" = ["up"]
"list.down" = ["down"]
"list.page-up" = ["pgup"]
"list.page-down" = ["pgdown"]
"place.last" = [";"]
"row.open" = ["enter"]
"session.adopt" = ["O"]
