# Code generated by go generate ./internal/mod from examples/mods/ticker; DO NOT EDIT.

# The ticker as a code mod (sidebar sections design §8, §11.8): when the
# ticker last polled a project's PRs and synced its repos, and whether
# its PR host answers. terminatr ships this mod built in: this folder is
# its source, and `go generate ./internal/mod` precompiles main.ts into
# the binary. To change it, copy the folder, give the copy another id,
# and install that (tm mod install refuses a built-in mod's id).
# It draws beside the coordinator's pane by default (place = "right"),
# in the sidebar's band (place = "sidebar"), or both. Turned off (the
# Mods tab, or [mods.ticker] enabled = false in config.toml), it draws
# nothing; core still warns of a failing PR host, in the coordinator's
# panel and after the project's name in the sidebar.
id = "ticker"
name = "Ticker"
version = "1.0.0"
api = "1.7"
description = "When the ticker last checked PRs and synced, and whether the PR host answers: a section beside the coordinator, or in the sidebar."
authors = ["terminatr"]
homepage = "https://github.com/theclifmeister/terminatr/tree/main/examples/mods/ticker"

[provides]
main = "main.js"

[[provides.views]]
id = "ticker"
title = "Ticker"
slot = "coordinator.section"
description = "this project's PR polls and sync"

[[provides.views]]
id = "band"
title = "Ticker"
slot = "sidebar.section"
description = "this project's PR polls and sync"

[settings.place]
type = "choice"
options = ["right", "sidebar", "both"]
default = "right"
label = "Where the ticker shows: beside the coordinator (right), in the sidebar, or both"

[permissions]
project_read = true
views = true
