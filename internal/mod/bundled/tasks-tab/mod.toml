# Code generated by go generate ./internal/mod from examples/mods/tasks-tab; DO NOT EDIT.

# The project popup's Tasks tab as a code mod (mods design §11 and §12,
# Phase 2). terminatr ships this mod built in and on: it draws the Tasks
# tab, which has no other drawing. Turned off (the Mods tab, or
# [mods.tasks-tab] enabled = false in config.toml), the tab says so.
# This folder is its source, and `go generate ./internal/mod` precompiles
# main.ts into the binary. To change it, copy the folder, give the copy another id and
# install it by path (tm mod install refuses a built-in mod's id).
id = "tasks-tab"
name = "Tasks tab"
version = "1.0.0"
api = "1.3"
description = "The project's tasks in its popup, grouped as the board has them; D, A, x, c, enter and + are tm's own actions, bound on each row and in the tab."
authors = ["terminatr"]
homepage = "https://github.com/theclifmeister/terminatr/tree/main/examples/mods/tasks-tab"

[provides]
main = "main.js"

[[provides.views]]
id = "tasks"
title = "tasks"
slot = "project.tab"

[permissions]
project_read = true
views = true
