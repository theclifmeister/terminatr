# The ascii icon set: every glyph of iconSet (icons.go), one cell wide (the
# connectors mid and end two), no emoji. coord and thread may be "".

name = "ascii"
wide = false

folder     = "+"
folderOpen = "+"
mid        = "|-"
end        = "`-"
coord      = ""
thread     = ""
hint       = "?"
current    = ">"
remote     = "@"
paused     = "="
inactive   = "/"
working    = "*"
blocked    = "!"
idle       = "o"
starting   = "~"
running    = ":"
review     = "#"
done       = "v"
other      = "-"
none       = "."
ciPass     = "+"
ciFail     = "x"
ciRun      = "~"
fold       = ">"
unfold     = "v"
todoDone   = "x"
todoNow    = "~"
todoOpen   = "o"
barOn      = "#"
barOff     = "-"
