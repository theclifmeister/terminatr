# The built-in layout (layout.toml v2, mod API 1.5). It sets only the
# sidebar's columns; every other key is shown commented out, with its
# built-in value. A layout states only what it changes: a key it leaves
# out keeps the built-in value, or the one the user set in the console.
# Uncomment and change what yours changes. (v1, any mod API 1.x, is
# the columns alone: a top-level array, sidebar = ["count", …].)

[sidebar]
# The columns, in order: count (steps or context), ci (the PR's checks),
# state, remote, paused, inactive and needs (needs you), and mods'
# (review-age.age). The safety columns (state, paused, inactive, needs)
# show even when a layout leaves them out, at the end.
columns = ["count", "ci", "state", "remote", "paused", "inactive", "needs"]
# Which edge: left or right.
# side = "left"
# The full sidebar's width: cells, 14 to 200, or a share of the window,
# "10%" to "60%". A narrow window still cuts it to leave the panes 60
# columns, then shows the slim strip.
# width = 36
# full, slim (the strip, as b) or hidden (none; a ⚑ N badge shows what
# needs you, and b brings the sidebar back).
# mode = "full"
# Mods' sidebar sections (mod API 1.7): the band's order, by
# "<mod>.<view>". "tree" marks where the projects tree sits: sections
# before it go above the tree, those after it below. Without "tree"
# all are below. A section the list leaves out goes below, after
# those it names, in the Mods tab's order; an id no mod has is skipped.
# A layout can't hide a section: turn its mod off in the Mods tab.
# sections = ["ticker.ticker", "tree"]
# The order of the sections under each project (mod API 1.7), always
# below its threads; the ones left out follow in the Mods tab's order.
# project_sections = ["ci-status.prs"]

[details]
# The dashboard's details panel: right (beside the list, in a window
# 120 columns wide or more), bottom (under the list, with 16 rows or
# more) or off. Where it can't show, the details show under the
# selected row.
# place = "right"
# The panel's size: cells (right, 24 to 200) or rows (bottom, 6 to 100),
# or a share, "20%" to "70%" (bottom's is "40%"). Not with place = "off".
# size = "35%"
# Mods' details-panel sections (mod API 1.7), by "<mod>.<view>", here
# and in a thread's info panel beside its pane. "core" marks the
# panel's own lines, under its title: sections before it go above them,
# those after it below. Without "core" all are below. A section the
# list leaves out goes below, after those it names, in the Mods tab's
# order; an id no mod has is skipped.
# sections = ["core"]

[coordinator]
# Mods' sections in the coordinator's info panel (mod API 1.7), by
# "<mod>.<view>", among its blocks: needs (NEEDS YOU), inbox, threads
# and deck (ON DECK). A section goes after the block listed before it,
# or just above the first block listed after it; the blocks keep their
# order, and one left out still shows in its place. Nothing goes above
# the panel's title and counts. Without a block all are at the bottom;
# a section the list leaves out goes at the bottom, after those it
# names, in the Mods tab's order.
# sections = ["needs", "inbox", "threads", "deck"]

[header]
# The dashboard's top row: shown or hidden (alarms then draw over the
# first row).
# style = "shown"

[footer]
# shown (rule, keys, message), compact (one row: the message, else the
# keys) or hidden (messages draw over the last row; ? lists the keys).
# style = "shown"

[status_bar]
# Under an attached pane: shown, or compact (no blank row above it).
# style = "shown"

[rows]
# normal, or compact: no extra lines (no details under the selected
# row, the tasks note on its section's line, mod cards' header only).
# What needs you, state, paused and inactive always show.
# density = "normal"

[dashboard]
# The list's sections, in order: needs (needs you), project, other
# (sessions outside projects), cards (mods' cards). other and cards can
# be left out to hide them; needs and project always show (first, if
# left out).
# sections = ["needs", "project", "other", "cards"]
