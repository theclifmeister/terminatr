# An example of terminatr's examples/mods: a layout, a data mod with no
# code (layout design v2 §2.1). It states only what it changes; every
# other key is the built-in value. Install it by path from a checkout,
# enable it, then pick it in Settings (General: Layout):
#   tm mod install terminatr/examples/mods/zen && tm mod enable zen
id = "zen"
name = "Zen"
version = "1.0.0"
api = "1.5"
description = "No sidebar, no details panel, a one-row footer, and only your needs and the project on the dashboard."
authors = ["terminatr"]
homepage = "https://github.com/theclifmeister/terminatr/tree/main/examples/mods/zen"

[provides]
layout = "layout.toml"
