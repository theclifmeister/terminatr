# An example of terminatr's examples/mods: a layout, a data mod with no
# code (layout design v2 §2.1). It states only what it changes; every
# other key is the built-in value. Install it by path from a checkout,
# enable it, then pick it in Settings (General: Layout):
#   tm mod install terminatr/examples/mods/compact && tm mod enable compact
id = "compact"
name = "Compact"
version = "1.0.0"
api = "1.5"
description = "A narrower sidebar, one-row footer and status bar, and no extra lines in the rows."
authors = ["terminatr"]
homepage = "https://github.com/theclifmeister/terminatr/tree/main/examples/mods/compact"

[provides]
layout = "layout.toml"
