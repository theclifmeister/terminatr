# The Nord palette (https://www.nordtheme.com) over tm's roles. Each role
# is { fg, bg, bold, faint, reverse }. A colour is an ANSI name, a 0-255
# index or #rrggbb; with two, the first is what a terminal without
# truecolor gets and the second what one with it gets. A role left out
# is the built-in one (default-theme's), so a theme can set only a few.
# The console picks [dark] or [light] by the terminal's background.
#
# [dark.pane] and [light.pane] (mod API 1.6) colour the panes: the
# programs' default foreground and background and their 16 ANSI colours
# (black red green yellow blue magenta cyan white, then the bright ones),
# each #rrggbb, on a terminal with truecolor. Every agent and shell
# follows; a program's own truecolor stays as it drew it, so Claude panes
# get a theme made from these roles and palette, live, also when you
# switch themes or your terminal turns light or dark. Leave the table out
# and the panes keep your terminal's own colours.

[dark]
head   = { fg = ["brightwhite", "#eceff4"], bold = true }
sel    = { fg = ["black", "#2e3440"], bg = ["cyan", "#88c0d0"] }
sel_focus = { fg = ["black", "#2e3440"], bg = ["brightcyan", "#8fbcbb"] }
faint  = { fg = ["brightblack", "#4c566a"] }
accent = { fg = ["cyan", "#88c0d0"] }
title  = { fg = ["cyan", "#8fbcbb"], bold = true }
bad    = { fg = ["red", "#bf616a"] }
warn   = { fg = ["yellow", "#ebcb8b"] }
good   = { fg = ["green", "#a3be8c"] }
info   = { fg = ["blue", "#81a1c1"] }
plain  = { fg = ["white", "#d8dee9"] }

[dark.pane]
fg = "#d8dee9"
bg = "#2e3440"
palette = [
  "#3b4252", "#bf616a", "#a3be8c", "#ebcb8b", "#81a1c1", "#b48ead", "#88c0d0", "#e5e9f0",
  "#4c566a", "#bf616a", "#a3be8c", "#ebcb8b", "#81a1c1", "#b48ead", "#8fbcbb", "#eceff4",
]

[light]
head   = { fg = ["black", "#2e3440"], bold = true }
sel    = { fg = ["brightwhite", "#eceff4"], bg = ["blue", "#5e81ac"] }
sel_focus = { fg = ["brightwhite", "#eceff4"], bg = ["magenta", "#b48ead"] }
faint  = { fg = ["brightblack", "#7b88a1"] }
accent = { fg = ["blue", "#5e81ac"] }
title  = { fg = ["blue", "#5e81ac"], bold = true }
bad    = { fg = ["red", "#bf616a"] }
warn   = { fg = ["yellow", "#d08770"] }
good   = { fg = ["green", "#6f8f57"] }
info   = { fg = ["blue", "#81a1c1"] }
plain  = { fg = ["black", "#3b4252"] }

# Nord's colours darkened where they'd fade on a light background.
[light.pane]
fg = "#2e3440"
bg = "#eceff4"
palette = [
  "#3b4252", "#bf616a", "#6f8f57", "#d08770", "#5e81ac", "#b48ead", "#4f8f9c", "#d8dee9",
  "#4c566a", "#bf616a", "#6f8f57", "#d08770", "#5e81ac", "#b48ead", "#4f8f9c", "#e5e9f0",
]
