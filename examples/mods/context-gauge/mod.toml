# Example 3 of terminatr's examples/mods (mods design §13): a cell in the
# sidebar and on the dashboard's thread rows, and a dashboard card whose
# rows bind a core action. Install it by path from a checkout:
#   tm mod install terminatr/examples/mods/context-gauge
id = "context-gauge"
name = "Context gauge"
version = "1.0.0"
api = "1.3"
description = "How full each session's context window is, by its row; a card lists the ones past the warning, where C clears one (tm asks first) and enter attaches to it. Claude sessions report theirs through the Agent mod or, with it off, from their transcript."
authors = ["terminatr"]
homepage = "https://github.com/theclifmeister/terminatr/tree/main/examples/mods/context-gauge"

[provides]
main = "main.ts"

[[provides.columns]]
id = "ctx"
title = "Ctx"
width = 5
where = ["sidebar.thread", "sidebar.coordinator", "dashboard.thread"]

[[provides.views]]
id = "full"
title = "Context nearly full"
slot = "dashboard.card"

[permissions]
# The card's rows bind session.attach and session.clear, which need
# project_read; session.clear also needs listing under actions, which the
# consent shows. The card itself needs views. The cells alone would need
# nothing.
project_read = true
views = true
actions = ["session.clear"]

[settings.warn]
type = "int"
default = 80
min = 50
max = 95
label = "Warn from this % of the context window"
