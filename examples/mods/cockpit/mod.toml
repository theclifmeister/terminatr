# An example of terminatr's examples/mods: a layout, a data mod with no
# code (layout design v2 §2.1). It states only what it changes; every
# other key is the built-in value. Install it by path from a checkout,
# enable it, then pick it in Settings (General: Layout):
#   tm mod install terminatr/examples/mods/cockpit && tm mod enable cockpit
id = "cockpit"
name = "Cockpit"
version = "1.0.0"
api = "1.5"
description = "The sidebar on the right at 22%, and the details panel along the bottom at 40%."
authors = ["terminatr"]
homepage = "https://github.com/theclifmeister/terminatr/tree/main/examples/mods/cockpit"

[provides]
layout = "layout.toml"
