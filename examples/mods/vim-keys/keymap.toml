# Each action id to all of its keys (docs/SPEC.md §4 Action ids): the
# list replaces the action's keys, so keep the ones you still want. An
# action left out keeps tm's keys (default-keymap's; j, k, h and l are
# there already). A key two actions want, or a locked one (esc, ctrl+c,
# the prefix and its commands), is refused and that action keeps its
# default; the console says so.

# Lists: the dashboard's task, thread and inbox lists, the popups.
"list.page-up"   = ["pgup", "ctrl+u"]
"list.page-down" = ["pgdown", "ctrl+d"]

# The sidebar.
"side.first"     = ["home", "g"]
"side.last"      = ["end", "G"]
"side.page-up"   = ["pgup", "ctrl+u"]
"side.page-down" = ["pgdown", "ctrl+d"]
